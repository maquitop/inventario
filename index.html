/* series del formulario de ingreso: se escriben una por una o se pegan varias */
function serHint(){const n=(F.series||[]).length;const q=Math.max(n,parseInt(F.qty,10)||1);const sin=q-n;
 return q===1?(n?'1 unidad con serie.':'1 unidad; la serie queda «Sin asignar» si no la escribes.'):q+' unidades: '+(n?n+' con serie'+(sin?' y '+sin+' sin asignar':''):'todas sin asignar')+'. Las series se pueden asignar o cambiar después.';}
function serAddTokens(toks){let add=0;const rep=[];toks.map(x=>String(x).trim()).filter(Boolean).forEach(v=>{const k=serKey(v);
  if((F.series||[]).some(x=>serKey(x)===k)){rep.push(v);return;}
  const o=S.items.find(x=>x.serie&&serKey(x.serie)===k);if(o){rep.push(v+' (ya la tiene '+o.code+')');return;}
  F.series.push(v);add++;});
 if(F.series.length>(parseInt(F.qty,10)||1))F.qty=String(F.series.length);
 if(rep.length)toast('No se agregó: '+rep.join(', ')+'.','bad',5000);return add;}
function serAddForm(){const inp=$('#f-serie');const v=(inp?inp.value:F.serie)||'';if(!v.trim()){if(inp)inp.focus();return;}
 serAddTokens(v.split(/[\r\n,;\t]+/));F.serie='';renderSheet(false);setTimeout(()=>{const i=$('#f-serie');if(i)i.focus();},30);}
async function saveNuevo(){
 if(BUSY)return;
 if(String(F.serie||'').trim()){serAddTokens(F.serie.split(/[\r\n,;\t]+/));F.serie='';}
 const errs=[];const p=F.np==='otro'?null:prodBy(F.np);const qty=Math.max((F.series||[]).length,Number(F.qty||1));
 if(F.np==='otro'&&!F.nombre.trim())errs.push('Escribe el nombre.');
 if(!Number.isInteger(qty)||qty<1||qty>500)errs.push('La cantidad debe ser un número entero entre 1 y 500.');
 const dup=(F.series||[]).find(v=>S.items.some(i=>i.serie&&serKey(i.serie)===serKey(v)));
 if(dup)errs.push('La serie '+dup+' ya está registrada en otro equipo.');
 if(errs.length)return fail(errs,F.np==='otro'&&!F.nombre.trim()?'f-nom':dup?'f-serie':'f-qty');
 setBusy('saveNuevo',true);try{
 const pp=p||{cat:F.cat,marca:F.marca.trim()||'Otra',nombre:F.nombre.trim(),modelo:F.modelo.trim()||'—'};
 // un modelo nuevo queda en el catálogo para elegirlo la próxima vez
 if(!p){const npx=(F.npx||'').trim();if(npx&&!S.prods.some(x=>norm(x.np)===norm(npx)))S.prods.push({id:'pr_'+npx.replace(/[^A-Za-z0-9_\-]/g,'_')+'_'+Date.now().toString(36),np:npx,nombre:pp.nombre,modelo:pp.modelo,marca:pp.marca,cat:pp.cat,serie:(F.series||[]).length>0});}
 let photo=null;if(F.photo){try{photo=await storeImage(F.photo);}catch(e){photo=null;}}
 const ids=[];for(let k=0;k<qty;k++){const it={id:newId('i'),code:nextCode(S.items,'code','MQ-',4),np:p?p.np:((F.npx||'').trim()||'—'),cat:pp.cat,marca:pp.marca,nombre:pp.nombre,modelo:pp.modelo,serie:F.series[k]||'',cond:'Operativo',loc:alm(F.alm),photo};S.items.push(it);ids.push(it.id);}
 newMov({tipo:'Ingreso',por:meName(),origen:'Ingreso al inventario',destino:alm(F.alm),items:ids});
 const nser=F.series.length;persist();render();replaceSheet(sItem,ids[0],qty>1?'g':'');toast(qty>1?plural(qty,'unidad agregada','unidades agregadas')+(nser?' ('+nser+' con serie)':' (series sin asignar)')+'.':'Equipo '+esc(item(ids[0]).code)+' agregado.');
 }finally{setBusy('saveNuevo',false);}
}
function recibir(){
 if(BUSY)return;
 const m=mov(R.mid);if(!m)return;
 if(!m.dest.includes(meName())){toast('Solo los destinatarios pueden confirmar.','bad');return;}
 const pend=pendingOf(m);const got=pend.filter(i=>!R.unchecked.includes(i.id));
 const needB=!(m.recs||[]).some(r=>r.boleta)&&!NO_BOLETA.includes(m.agencia);
 if(!got.length){toast('Marca al menos un equipo que llegó.','bad');return;}
 if(needB){const r=bolReady('rec');if(!r.ok){toast(r.msg,'bad');return;}}
 const miss=pend.length-got.length;
 ask({skip:!miss,title:'Faltan equipos',ok:'Registrar recepción parcial',html:'<ul class="sum"><li>Recibes <b>'+got.length+' de '+pend.length+'</b> equipos.</li>'+(miss?'<li style="color:var(--bad)">'+plural(miss,'equipo quedará','equipos quedarán')+' como <b>no recibido</b> y el envío quedará con recepción parcial.</li>':'')+(R.obs?'<li>Se registrará con observaciones.</li>':'')+'<li>Queda a nombre de <b>'+esc(meName())+'</b>'+(needB?' con tu boleta':'')+'. Se avisará a '+esc(m.por)+'.</li></ul>',fn:async()=>{
  setBusy('recibir',true);try{
  const b=BOL.rec;let ref=null;
  if(needB){try{ref=b.state==='sample'?'ej':await storeImage(b.src);}catch(e){toast('No se pudo guardar la foto de la boleta.','bad');return;}}
  if(!isOpen(m)){toast('Este envío ya fue actualizado por otra persona.','bad');renderSheet(false);return;}
  const still=pendingOf(m).map(i=>i.id);const g2=got.filter(i=>still.includes(i.id));
  const d=m.destino.t==='tecnico'?tec(meName(),m.destino.o):clone(m.destino);
  g2.forEach(i=>{i.loc=clone(d);});
  m.recs=m.recs||[];m.recs.push({por:meName(),fecha:nowIso(),items:g2.map(i=>i.id),boleta:ref,bolHash:b&&b.hash||null,bolCheck:needB?bolCheckRecord(b):null,nota:(R.nota||'').trim(),obs:!!R.obs});
  const left=pendingOf(m).length;m.estado=left?'parcial':'recibido';
  const ev=(left||R.obs)?'parcial':'recepcion';
  notify(ev,{titulo:(left?'Recepción parcial ':'Recibido ')+m.num+': '+g2.length+' de '+m.items.length+' equipos',texto:meName()+' confirmó '+plural(g2.length,'equipo','equipos')+(left?'. No llegó: '+pendingOf(m).map(i=>i.nombre).join(', '):'')+(R.obs?'. Con observaciones':'')+((R.nota||'').trim()?': '+R.nota.trim():'.'),body:movBody(m)+(left?'\nNo llegó: '+pendingOf(m).map(i=>i.nombre+' '+sn(i)).join(', '):'')+((R.nota||'').trim()?'\nNota de recepción: '+R.nota.trim():''),mov:m.id,para:[m.por].concat(m.dest)});
  R={};delete BOL.rec;persist();checkKits(false);render();replaceSheet(sDone,m.id,left?'Recepción parcial registrada':'Recepción confirmada');
  const rk=m.kit?kitById(m.kit):null;if(rk&&!left&&rk.resp!==meName()){rk.resp=meName();rk.mod=rk.mod||[];rk.mod.push({fecha:nowIso(),por:meName(),texto:'Responsable: '+meName()+' (recibió el kit en '+m.num+').'});persist();}
  if(rk&&kitInfo(rk).st==='completo')toast('<span class="bubble pop">'+IC.check+esc(rk.code)+'</span> Kit completo recibido: '+esc(locShort(kitInfo(rk).loc)),'',5200);
  }finally{setBusy('recibir',false);}
 }});
}
function anular(id){
 const m=mov(id);
 ask({title:'¿Anular el envío?',ok:'Sí, anular',danger:true,html:'<p style="margin:0">'+esc(m.num)+' quedará como anulado y '+plural(m.items.length,'el equipo vuelve','los equipos vuelven')+' a donde estaba'+(m.items.length>1?'n':'')+' antes del envío. Se avisará a '+esc(names(m.dest))+'.</p>',fn:()=>{
  if(!(m.estado==='pendiente'&&!(m.recs||[]).length)){toast('Ya no se puede anular: alguien registró la recepción.','bad');renderSheet(false);return;}
  m.items.forEach(iid=>{const i=item(iid);if(i&&i.loc.t==='transito'&&i.loc.mov===m.id)i.loc=clone(m.from&&m.from[iid]?m.from[iid]:alm(almPrin()));});
  m.estado='anulado';m.nota=(m.nota?m.nota+' · ':'')+'Anulado por '+meName()+' el '+fmt(nowIso())+'.';
  notify('anulado',{titulo:'Envío '+m.num+' anulado',texto:meName()+' anuló el envío. Los equipos vuelven a su lugar.',body:movBody(m),mov:m.id,para:m.dest});
  commit();toast(esc(m.num)+' anulado.');
 }});
}
function waText(m){
 const its=m.items.map(item).filter(Boolean);const L=['*MAQUITOP · '+m.tipo.toUpperCase()+'* '+m.num];
 if(m.tipo==='Envío'){L.push('De: '+m.origen+' ('+m.por+')');L.push('Para: '+movDest(m));if(m.agencia)L.push(m.agencia+(m.guia?' · Guía '+m.guia:'')+(m.boletaEnv?' · boleta adjunta':''));}
 else L.push(m.origen+' → '+locText(m.destino));
 L.push('Equipos ('+its.length+'):');its.slice(0,15).forEach(i=>L.push('• '+i.nombre+' · '+sn(i)));if(its.length>15)L.push('• y '+(its.length-15)+' más');
 if(m.nota)L.push('Nota: '+m.nota);L.push('Registró: '+m.por+' · '+fmt(m.fecha));
 if(m.estado==='pendiente')L.push('⏳ Solo '+namesO(m.dest)+' '+(m.dest.length>1?'pueden':'puede')+' confirmar la recepción en la app.');
 (m.recs||[]).forEach(r=>L.push('✅ Recibió '+r.por+' · '+fmt(r.fecha)+' · '+r.items.length+' de '+m.items.length+(r.obs?' (con observaciones)':'')));
 if(m.estado==='parcial')L.push('⚠️ No llegó: '+pendingOf(m).map(i=>i.nombre+' '+sn(i)).join(', '));
 if(m.estado==='anulado')L.push('❌ Envío anulado.');
 return L.join('\n');
}

function isOwnerPerson(p){return MODE==='online'&&!!p&&!!p.uid&&ME.owner&&p.uid===ME.uid;}

function saveTpl(){
 const e=G.tp;const errs=[];
 if(!e.n.trim())errs.push('Escribe el nombre de la plantilla.');
 if(!e.slots.length)errs.push('Agrega al menos un espacio.');
 if(e.slots.some(s=>!s.l.trim()))errs.push('Todos los espacios necesitan un nombre.');
 if(e.slots.some(s=>!s.nps.length))errs.push('Cada espacio debe aceptar al menos un modelo.');
 const bad=e.slots.some(s=>s.nps.some(np=>{const p=prodBy(np);return p&&p.marca!==e.marca&&p.marca!=='Genérica';}));
 if(bad)errs.push('Hay modelos de otra marca. Un kit debe ser un solo sistema '+e.marca+'.');
 if(S.tpls.some(t=>t.id!==e.id&&norm(t.n)===norm(e.n)))errs.push('Ya existe una plantilla con ese nombre.');
 if(errs.length){toast(errs[0],'bad');return;}
 const t=e.id==='new'?null:tplById(e.id);
 ask({skip:true,title:'¿Guardar la plantilla?',ok:'Guardar',html:'<p style="margin:0"><b>'+esc(e.n)+'</b> · '+esc(e.marca)+' · para '+esc(e.maquinas.join(', ')||'cualquier máquina')+' · '+plural(e.slots.length,'espacio','espacios')+'.</p>',fn:()=>{
  const nt={id:t?t.id:newId('t'),n:e.n.trim(),marca:e.marca,maquinas:e.maquinas.slice(),slots:e.slots.map(s=>({id:s.id,l:s.l.trim(),nps:s.nps.slice()}))};
  if(t){
   remapTplKits(t,nt);
   Object.assign(t,nt);
  }else S.tpls.push(nt);
  G.tp=null;commit();closeSheet();toast('Plantilla guardada.');
 }});
}

function saveAlm(){
 const e=G.al;if(!e)return;const n=(e.n||'').trim().replace(/\s+/g,' '),ci=(e.ciudad||'').trim().replace(/\s+/g,' ');
 if(!n||!ci){toast('Escribe el nombre y la ciudad.','bad');return;}
 const L=almsMut();const x=e.id==='new'?null:L.find(y=>y.id===e.id);
 if(e.id!=='new'&&!x){toast('Ese almacén ya no existe.','bad');return;}
 if(L.some(y=>y!==x&&norm(y.n)===norm(n))){toast('Ya existe un almacén con ese nombre.','bad');return;}
 let r=x;
 if(x){const old=x.n;x.n=n;x.ciudad=ci;if(old!==n)renameAlm(old,n);S.people.forEach(p=>{if(p.alm===n&&!(p.obra&&obra(p.obra)))p.base=ci;});}
 else{r={id:newId('a'),n,ciudad:ci,principal:false};L.push(r);}
 if(e.principal)L.forEach(y=>{y.principal=(y===r);});
 if(e.id==='new')lugarCtx(G.alCtx,'a',r);
 G.al=null;commit();closeSheet();toast(e.id==='new'?esc(n)+' agregado.':'Almacén guardado.');
}

function gsearchResults(q){
 const n=norm(q).trim();if(!n)return '';
 const its=S.items.filter(i=>norm([i.nombre,i.serie,i.np,i.code,i.marca].join(' ')).includes(n)).slice(0,6);
 const ks=S.kits.filter(k=>norm(k.code+' '+tplOf(k).n).includes(n)).slice(0,3);
 const ms=S.movs.filter(m=>norm([m.num,m.guia,m.origen,movDest(m),m.agencia].join(' ')).includes(n)).sort(byDateDesc).slice(0,4);
 const ps=S.prods.filter(p=>norm(p.np+' '+p.nombre+' '+p.modelo).includes(n)).slice(0,3);

function normH(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[°º#.\/:_\-()"']/g,' ').replace(/\s+/g,' ').trim();}
function matchField(h){
 if(h==null||h instanceof Date||typeof h==='number')return {f:'',s:0};
 const n=normH(h);if(!n||n.length>40)return {f:'',s:0};
 let best={f:'',s:0};
 Object.keys(SYN).forEach(f=>SYN[f].forEach(sy=>{const s=n===sy?3:(n.startsWith(sy+' ')||n.endsWith(' '+sy))?2:(' '+n+' ').includes(' '+sy+' ')?1:0;if(s>best.s)best={f,s};}));
 return best;
}
function detectHeader(rows){let br=-1,bc=1;for(let r=0;r<Math.min(rows.length,15);r++){const c=(rows[r]||[]).filter(x=>matchField(x).s>=2).length;if(c>bc){bc=c;br=r;}}return br;}
function colVals(rows,start,c){const v=[];for(let r=start;r<rows.length&&v.length<80;r++){const x=(rows[r]||[])[c];if(x!==''&&x!=null)v.push(x);}return v;}
function frac(v,fn){return v.length?v.filter(fn).length/v.length:0;}
function isDateVal(v){if(v instanceof Date)return !isNaN(v);if(typeof v!=='string')return false;return /^\s*\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}(\s+\d{1,2}:\d{2})?\s*$/.test(v)||/^\s*\d{4}-\d{1,2}-\d{1,2}/.test(v);}
function isQtyLoose(v){return typeof v==='number'||/^\s*\d+([.,]\d+)?\s*$/.test(String(v));}
function isQtyStrict(v){if(typeof v==='number')return Number.isInteger(v)&&v>=1&&v<=9999;return /^\s*\d{1,4}\s*$/.test(String(v));}
function parseDate(v){
 let y,mo,d,h=9,mi=0;
 if(v instanceof Date){if(isNaN(v))return null;const t=new Date(v.getTime()+30000);y=t.getFullYear();mo=t.getMonth()+1;d=t.getDate();if(t.getHours()||t.getMinutes()){h=t.getHours();mi=t.getMinutes();}}
 else if(typeof v==='number'&&v>20000&&v<80000){const t=new Date(Math.round((v-25569)*86400000));y=t.getUTCFullYear();mo=t.getUTCMonth()+1;d=t.getUTCDate();}
 else{const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?$/);
  if(m){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;if(m[4]){h=+m[4];mi=+m[5];}}
  else{m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s](\d{1,2}):(\d{2}))?/);if(!m)return null;y=+m[1];mo=+m[2];d=+m[3];if(m[4]){h=+m[4];mi=+m[5];}}}
 if(!(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2000&&y<=2100))return null;
 return y+'-'+pad2(mo)+'-'+pad2(d)+'T'+pad2(h)+':'+pad2(mi);
}
function tipoOf(v){const n=norm(v).trim();if(!n)return null;if(/^(ingreso|ingresa|entrada|entra|compra|alta|inventario|stock|inicial|nuevo|carga)/.test(n))return 'Ingreso';if(/^(traslado|salida|sale|envio|enviado|despacho|transferencia|devolucion|devuelto|reubicacion|movimiento)/.test(n))return 'Traslado';if(/^(baja|desecho|perdida|perdido|robo|chatarra)/.test(n))return 'Baja';return null;}
function catOf(v){const n=norm(v);if(!n)return null;{const cu=catList().find(c=>norm(c.n)===n||(!CATS[c.id]&&n.includes(norm(c.n))));if(cu)return cu.id;}if(/cable|hdmi|conector|extension/.test(n))return 'cable';if(/base magnet|iman|soporte|montaje|base /.test(n))return 'iman';if(/camara/.test(n))return 'camara';if(/laser/.test(n))return 'laser';if(/radio/.test(n))return 'radio';if(/pantalla|panel|control box|monitor|display|tablet/.test(n))return 'pantalla';if(/sensor|imu|inclin|rotacion/.test(n))return 'sensor';if(/antena|gnss|gps|receptor/.test(n))return 'gnss';return null;}
function resolveLugar(v){
 const n=norm(v).trim();if(!n)return null;
 for(const o of S.obras)for(const m of o.maqs){const code=norm(m.split(' · ').pop());if(code&&n.includes(code))return inst(o.id,m);}

function findNp(v){const k=npKey(v);if(!k)return null;const raw=String(v).trim().toUpperCase();const p=S.prods.find(x=>x.np.toUpperCase()===raw)||S.prods.find(x=>npKey(x.np)===k);return p?p.np:null;}
function findProdByName(art){const n=norm(art);let best=null,bs=0;S.prods.forEach(p=>{const k=p.np;const toks=norm(p.nombre).split(/\s+/).filter(t=>t.length>2);if(toks.length&&toks.every(t=>n.includes(t))){const s=toks.length+(n.includes(norm(p.modelo))?2:0);if(s>bs){bs=s;best=k;}}});return best;}

async function readImport(file){

function autoMap(detectHdr){
 const rows=IMP.sheets[IMP.sheetIx].rows;
 if(detectHdr)IMP.headerRow=detectHeader(rows);
 let ncol=0;rows.slice(0,300).forEach(r=>{if(r.length>ncol)ncol=r.length;});
 const map=Array(ncol).fill(''),how=Array(ncol).fill(''),sc=Array(ncol).fill(0);
 const start=IMP.headerRow+1;
 if(IMP.headerRow>=0){const hr=rows[IMP.headerRow]||[];const best={};
  for(let c=0;c<ncol;c++){const m=matchField(hr[c]);if(m.f&&m.s>=1&&(!best[m.f]||best[m.f].s<m.s))best[m.f]={c,s:m.s};}
  Object.keys(best).forEach(f=>{const c=best[f].c;if(map[c]&&sc[c]>=best[f].s)return;map[c]=f;sc[c]=best[f].s;how[c]='encabezado';});}
 const unmap=c=>{map[c]='';how[c]='';};
 for(let c=0;c<ncol;c++){const f=map[c];if(!f)continue;const v=colVals(rows,start,c);if(!v.length)continue;
  if(f==='fecha'&&frac(v,isDateVal)<.5)unmap(c);
  else if(f==='cantidad'&&frac(v,isQtyLoose)<.5)unmap(c);
  else if(f==='tipo'&&frac(v,x=>!!tipoOf(x))<.5){if(frac(v,x=>!!catOf(x))>=.5&&!map.includes('categoria'))map[c]='categoria';else unmap(c);}
  else if(f==='lugar'&&sc[c]<3&&frac(v,x=>!!resolveLugar(x))<.3)unmap(c);}
 const has=f=>map.includes(f);
 const tryF=(f,test,th)=>{if(has(f))return;for(let c=0;c<ncol;c++){if(map[c])continue;const v=colVals(rows,start,c);if(v.length&&frac(v,test)>=th){map[c]=f;how[c]='contenido';return;}}};
 tryF('fecha',isDateVal,.6);tryF('np',x=>!!findNp(x),.5);tryF('tipo',x=>!!tipoOf(x),.6);tryF('lugar',x=>!!resolveLugar(x),.6);tryF('cantidad',isQtyStrict,.8);
 if(!has('serie'))for(let c=0;c<ncol;c++){if(map[c])continue;const v=colVals(rows,start,c).map(x=>String(x).trim());if(v.length&&frac(v,x=>/^[A-Za-z0-9\-]{5,20}$/.test(x)&&/\d/.test(x))>=.6&&new Set(v).size>=v.length*.9){map[c]='serie';how[c]='contenido';break;}}
 if(!has('articulo')){let bc=-1,bl=0;for(let c=0;c<ncol;c++){if(map[c])continue;const v=colVals(rows,start,c).filter(x=>typeof x==='string');if(!v.length||frac(v,x=>/[a-záéíóúñ]{3}/i.test(x))<.7)continue;const avg=v.reduce((a,x)=>a+x.length,0)/v.length;if(avg>bl){bl=avg;bc=c;}}if(bc>=0&&bl>=5){map[bc]='articulo';how[bc]='contenido';}}

function analyze(){
 const I=IMP,rows=I.sheets[I.sheetIx].rows,start=I.headerRow+1;
 const col=f=>I.map.indexOf(f);
 const raw=(row,f)=>{const c=col(f);return c<0?'':row[c];};
 const txt=(row,f)=>{const v=raw(row,f);return v instanceof Date?v:String(v==null?'':v).trim();};
 const used=new Set(),newSer=new Set(),out=[];
 for(let r=start;r<rows.length;r++){
  const row=rows[r]||[];if(!row.some(x=>x!==''&&x!=null))continue;
  const o={r:r+1,msgs:[],level:'ok',create:[],move:[],baja:[]};
  const warn=m=>{o.msgs.push(m);if(o.level==='ok')o.level='warn';};
  const err=m=>{o.msgs.push(m);o.level='error';};
  const npRaw=txt(row,'np'),art=String(txt(row,'articulo'));
  let npK=npRaw?findNp(npRaw):null;if(!npK&&art)npK=findProdByName(art);

  const mv=String(txt(row,'marca'));o.marca=prod?prod.marca:(mv||(/\bchc\b/i.test(art)?'CHC':/leica/i.test(art)?'Leica':'Otra'));
  o.modelo=prod?prod.modelo:(String(txt(row,'modelo'))||'—');
  const tv=String(txt(row,'tipo'));let tipo=tv?tipoOf(tv):null;
  if(tv&&!tipo){if(catOf(tv)&&o.cat==='otro')o.cat=catOf(tv);else warn('Tipo “'+tv+'” no reconocido. Se toma como '+I.defTipo+'.');}
  o.tipo=tipo||I.defTipo;
  const fv=raw(row,'fecha');const hasF=fv!==''&&fv!=null;const fe=hasF?parseDate(fv):null;
  if(hasF&&!fe)warn('Fecha “'+(fv instanceof Date?fv.toISOString():fv)+'” no reconocida. Se usa la de hoy.');
  o.fecha=fe||nowIso();o.fechaTxt=fe?fday(fe):'Hoy';
  const lv=String(txt(row,'lugar'));let loc=lv?resolveLugar(lv):null;
  if(lv&&!loc)warn('Lugar “'+lv+'” no reconocido. Se usa '+I.defLugar+'.');
  if(!loc){loc=o.tipo==='Baja'?null:alm(I.defLugar);}
  const pv=String(txt(row,'persona'));
  if(pv&&loc&&loc.t==='tecnico'){const p=S.people.find(p=>norm(p.n)===norm(pv)||norm(p.n).startsWith(norm(pv)));if(p)loc.p=p.n;else warn('Persona “'+pv+'” no encontrada; recibe '+loc.p+'.');}
  o.loc=loc;o.lugarTxt=loc?locShort(loc):'—';
  const qv=raw(row,'cantidad');let qty=1;
  if(qv!==''&&qv!=null){const q=typeof qv==='number'?qv:Number(String(qv).replace(',','.').trim());if(!Number.isInteger(q)||q<1||q>5000)err('Cantidad “'+qv+'” no válida. Escribe un número entero.');else qty=q;}
  const sv=txt(row,'serie');const series=sv?String(sv).split(/[,;\n]+|\s+\/\s+/).map(s=>s.trim()).filter(Boolean):[];
  if(series.length>1&&qv!==''&&qv!=null&&series.length!==qty&&o.level!=='error')warn(series.length+' series y cantidad '+qty+': se toman las series.');
  if(series.length)qty=series.length;
  o.qty=qty;o.series=series;o.cond=condOf(txt(row,'estado'));o.nota=String(txt(row,'nota'));o.guia=String(txt(row,'guia'));
  if(o.level!=='error'){
   const find=s=>S.items.find(i=>i.serie&&norm(i.serie)===norm(s));
   if(o.tipo==='Ingreso'){
    if(series.length){series.forEach(s=>{const ex=find(s);if(ex)o.msgs.push('La serie '+s+' ya existe ('+ex.code+' · '+locShort(ex.loc)+'). No se duplica.');else if(newSer.has(norm(s)))o.msgs.push('La serie '+s+' está repetida en el archivo.');else{newSer.add(norm(s));o.create.push(s);}});
     if(!o.create.length)o.level='skip';else if(o.create.length<series.length&&o.level==='ok')o.level='warn';}
    else{for(let k=0;k<qty;k++)o.create.push('');if(prod?prod.serie:(o.cat!=='cable'&&o.cat!=='iman'&&o.cat!=='otro'))warn('Sin serie: se crean '+plural(qty,'unidad','unidades')+' con la serie «Sin asignar».');}
   }else if(o.tipo==='Traslado'){
    if(series.length){series.forEach(s=>{const ex=find(s);if(!ex)o.msgs.push('La serie '+s+' no existe en el inventario.');else if(ex.loc.t==='transito')o.msgs.push('La serie '+s+' está en tránsito; no se mueve.');else if(locKey(ex.loc)===locKey(loc))o.msgs.push('La serie '+s+' ya está en '+locShort(loc)+'.');else{const k=kitOf(ex.id);if(k)warn('La serie '+s+' es parte de '+k.code+'; el kit quedará repartido.');o.move.push(ex.id);used.add(ex.id);}});}
    else{const c=S.items.filter(i=>!used.has(i.id)&&(prod?i.np===npK:norm(i.nombre)===norm(o.nombre))&&i.cond==='Operativo'&&!kitOf(i.id)&&i.loc.t!=='transito'&&i.loc.t!=='instalado'&&locKey(i.loc)!==locKey(loc)).sort((a,b)=>(a.loc.t==='almacen'?(a.loc.a===almPrin()?0:1):2)-(b.loc.t==='almacen'?(b.loc.a===almPrin()?0:1):2));
     const take=c.slice(0,qty);take.forEach(i=>used.add(i.id));o.move=take.map(i=>i.id);

     if(take.length)o.msgs.push('Se toman de '+[...new Set(take.map(i=>locShort(i.loc)))].join(', ')+'.');}
    if(!o.move.length)o.level='skip';else if(o.msgs.length&&o.level==='ok'&&o.move.length<qty)o.level='warn';
   }else{

    else{series.forEach(s=>{const ex=find(s);if(!ex)o.msgs.push('La serie '+s+' no existe en el inventario.');else if(kitOf(ex.id))o.msgs.push('La serie '+s+' está en '+kitOf(ex.id).code+'. Quítala del kit antes de darla de baja.');else o.baja.push(ex.id);});if(!o.baja.length)o.level='skip';}
   }
  }

 }
 I.rows=out;
}

let TIMP=null;
const TSYN={plantilla:['plantilla','kit','nombre del kit','nombre de plantilla','tipo de kit','sistema de kit'],marca:['marca','sistema','fabricante'],maquinas:['maquinas','maquina','tipo de maquina','tipos de maquina','sirve para','equipo pesado'],espacio:['espacio','componente','pieza','posicion','slot','espacio del kit','parte del kit'],nps:['n de parte aceptados','n parte aceptados','numeros de parte','n de parte','np','n parte','part number','numero de parte','nro de parte','modelos','acepta']};
function tmatch(h){const n=normH(h);if(!n)return '';let best='',bs=0;Object.keys(TSYN).forEach(f=>TSYN[f].forEach(sy=>{const s=n===sy?3:n.startsWith(sy)?2:(' '+n+' ').includes(' '+sy+' ')?1:0;if(s>bs){bs=s;best=f;}}));return best;}
function maqOf(v){const n=norm(v).trim();if(!n)return null;if(/^excav/.test(n))return 'Excavadora';if(/^(dozer|tractor|bulldozer|topador)/.test(n))return 'Dozer';if(/^moto/.test(n))return 'Motoniveladora';if(/^(rodillo|compact)/.test(n))return 'Rodillo';if(/^(cargador|pala)/.test(n))return 'Cargador';if(/^(pavim|asfalt)/.test(n))return 'Pavimentadora';return null;}
async function readTplImport(file){
 if(!file)return;let X;try{X=await loadXLSX();}catch(e){toast('No se pudo cargar el lector de Excel. Revisa tu conexión.','bad');return;}
 try{
  const buf=await file.arrayBuffer();const csv=/\.(csv|txt)$/i.test(file.name);let wb;
  if(csv){let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){text=new TextDecoder('windows-1252').decode(buf);}wb=X.read(text.replace(/^﻿/,''),{type:'string',raw:true});}else wb=X.read(buf,{type:'array'});
  let found=null;
  for(const name of wb.SheetNames){const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});for(let r=0;r<Math.min(rows.length,12);r++){const m=(rows[r]||[]).map(tmatch);if(m.includes('plantilla')&&m.includes('espacio')&&m.includes('nps')){found={name,rows,hr:r,map:m};break;}}if(found)break;}
  if(!found){toast('No encontré columnas Plantilla, Espacio y N° de parte. Descarga el formato desde “Descargar plantillas en Excel”.','bad',7000);return;}
  analyzeTpl(file.name,found);openSheet(sTplImp);
 }catch(e){console.error(e);toast('No se pudo leer el archivo. Verifica que sea un Excel (.xlsx, .xls) o CSV.','bad');}
}
function analyzeTpl(fileName,f){
 const col=k=>f.map.indexOf(k);const ci={p:col('plantilla'),m:col('marca'),q:col('maquinas'),e:col('espacio'),n:col('nps')};
 const groups=new Map();let last={p:'',m:'',q:''};
 f.rows.slice(f.hr+1).forEach((row,ix)=>{
  const g=k=>ci[k]>=0?String(row[ci[k]]==null?'':row[ci[k]]).trim():'';
  let p=g('p'),m=g('m'),q=g('q');const e=g('e'),n=g('n');
  if(!p&&!e&&!n)return;
  if(!p)p=last.p;else if(p!==last.p){last={p,m:'',q:''};}
  if(!m)m=last.m;else last.m=m;if(!q)q=last.q;else last.q=q;
  if(!p)return;
  if(!groups.has(norm(p)))groups.set(norm(p),{n:p,marca:m,maqTxt:q,rows:[]});
  const G0=groups.get(norm(p));if(m&&!G0.marca)G0.marca=m;if(q&&!G0.maqTxt)G0.maqTxt=q;
  G0.rows.push({r:f.hr+2+ix,l:e,nps:n});
 });
 const out=[];
 groups.forEach(gp=>{
  const errs=[],warns=[];
  const maqs=[];String(gp.maqTxt||'').split(/[,;\/\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const t=maqOf(x);if(t){if(!maqs.includes(t))maqs.push(t);}else warns.push('Máquina no reconocida: “'+x+'”. Usa: '+MAQ_TIPOS.join(', ')+'.');});
  const seen={};
  const slots=gp.rows.map(r=>{let l=r.l||'';if(!l){errs.push('Fila '+r.r+': falta el nombre del espacio.');l='Espacio';}
   const key=norm(l);seen[key]=(seen[key]||0)+1;if(seen[key]>1){warns.push('Fila '+r.r+': el espacio “'+l+'” se repite; se guarda como “'+l+' '+seen[key]+'”.');l=l+' '+seen[key];}
   const raw=String(r.nps||'').split(/[\/,;\n]+| o /i).map(x=>x.trim()).filter(Boolean);const nps=[];
   raw.forEach(x=>{const np=findNp(x);if(np){if(!nps.includes(np))nps.push(np);}else errs.push('Fila '+r.r+': el N° de parte “'+x+'” no está en el catálogo.');});
   if(!raw.length)errs.push('Fila '+r.r+' (“'+l+'”): no tiene N° de parte.');
   return {l,nps};});
  let marca=String(gp.marca||'').trim();
  const brands={};slots.forEach(s=>s.nps.forEach(np=>{const p=prodBy(np);if(p&&p.marca!=='Genérica')brands[p.marca]=(brands[p.marca]||0)+1;}));
  const known=[...new Set(S.prods.map(p=>p.marca))];
  const mk=known.find(k=>norm(k)===norm(marca));
  if(!marca){marca=Object.keys(brands).sort((a,b)=>brands[b]-brands[a])[0]||'';if(marca)warns.push('Sin marca: se usa '+marca+' según sus N° de parte.');else errs.push('Falta la marca del sistema.');}
  else if(mk)marca=mk;else errs.push('Marca “'+marca+'” no reconocida. Usa: '+known.filter(k=>k!=='Genérica').join(', ')+'.');
  const other=Object.keys(brands).filter(b=>b!==marca);
  if(marca&&other.length)errs.push('Mezcla marcas ('+other.join(', ')+' con '+marca+'). Un kit debe ser un solo sistema.');
  const ex=S.tpls.find(t=>norm(t.n)===norm(gp.n));
  // emparejar espacios por nombre con la plantilla existente
  let mx=0;if(ex)ex.slots.forEach(s=>{mx=Math.max(mx,codeNum(s.id));});
  const nt={id:ex?ex.id:'new',n:gp.n.trim(),marca,maquinas:maqs.length?maqs:(ex?ex.maquinas.slice():[]),slots:slots.map(s=>{const o=ex?ex.slots.find(x=>norm(x.l)===norm(s.l)):null;return {id:o?o.id:'s'+(++mx),l:s.l,nps:s.nps};})};
  if(!ex)nt.slots.forEach((s,i)=>{s.id='s'+(i+1);});
  if(!maqs.length&&!ex)warns.push('Sin tipo de máquina: el kit servirá para cualquiera.');
  const changes=[];let freed=0,kitsN=0;
  if(ex){
   if(ex.marca!==nt.marca)changes.push('Marca: '+ex.marca+' → '+nt.marca);
   if((ex.maquinas||[]).join(',')!==nt.maquinas.join(','))changes.push('Máquinas: '+((ex.maquinas||[]).join(', ')||'—')+' → '+(nt.maquinas.join(', ')||'—'));
   nt.slots.forEach(s=>{const o=ex.slots.find(x=>x.id===s.id);if(!o)changes.push('Espacio nuevo: '+s.l+' ('+s.nps.join(' / ')+')');else if(o.nps.slice().sort().join('|')!==s.nps.slice().sort().join('|'))changes.push(s.l+': acepta '+s.nps.join(' / ')+' (antes '+o.nps.join(' / ')+')');});
   ex.slots.forEach(o=>{if(!nt.slots.some(s=>s.id===o.id))changes.push('Se quita el espacio: '+o.l);});
   if(ex.slots.map(s=>s.id).join(',')!==nt.slots.filter(s=>ex.slots.some(o=>o.id===s.id)).map(s=>s.id).join(',')&&!changes.length)changes.push('Cambia el orden de los espacios');
   const ks=S.kits.filter(k=>k.tpl===ex.id);kitsN=ks.length;
   ks.forEach(k=>{ex.slots.forEach((s,ix)=>{const id=k.slots[ix];if(!id)return;const ns=nt.slots.find(x=>x.id===s.id);const it=item(id);if(!ns||(it&&!ns.nps.includes(it.np)))freed++;});});
  }
  out.push({nt,ex:ex||null,errs,warns,changes,freed,kitsN,status:errs.length?'error':!ex?'nueva':changes.length?'cambia':'igual'});
 });
 TIMP={file:fileName,sheet:f.name,list:out,applied:null};
}

/* Ajusta los kits de una plantilla editada: empareja por id de espacio y libera lo que ya no corresponde */
function remapTplKits(t,nt){
 let total=0;
 S.kits.filter(k=>k.tpl===t.id).forEach(k=>{const byId={};t.slots.forEach((s,ix)=>{byId[s.id]=k.slots[ix]||null;});const ns=nt.slots.map(s=>byId[s.id]||null);
  const freed=Object.keys(byId).filter(sid=>byId[sid]&&!nt.slots.some(s=>s.id===sid)).map(sid=>byId[sid]);
  nt.slots.forEach((s,ix)=>{const it=ns[ix]?item(ns[ix]):null;if(it&&!s.nps.includes(it.np)){freed.push(it.id);ns[ix]=null;}});
  k.slots=ns;total+=freed.length;if(freed.length){k.mod=k.mod||[];k.mod.push({fecha:nowIso(),por:meName(),texto:'Plantilla editada: '+plural(freed.length,'pieza quedó','piezas quedaron')+' fuera del kit ('+freed.map(id=>{const i=item(id);return i?i.nombre+' '+sn(i):'';}).join(', ')+').'});}});
 return total;
}
function applyTplImport(){
 if(guard('importar'))return;const T=TIMP;if(!T)return;const go=T.list.filter(x=>x.status==='nueva'||x.status==='cambia');if(!go.length)return;
 ask({title:'¿Aplicar las plantillas?',ok:'Aplicar',html:'<ul class="sum">'+go.map(x=>'<li><b>'+esc(x.nt.n)+'</b>: '+(x.status==='nueva'?'nueva':plural(x.changes.length,'cambio','cambios')+(x.freed?' · '+plural(x.freed,'pieza queda libre','piezas quedan libres'):''))+'</li>').join('')+'</ul>',fn:()=>{
  const snap=JSON.stringify({tpls:S.tpls,kits:S.kits});let nuevas=0,cambiadas=0,freed=0;
  go.forEach(x=>{const nt=clone(x.nt);if(x.ex&&tplById(x.ex.id)){const t=tplById(x.ex.id);nt.id=t.id;freed+=remapTplKits(t,nt);Object.assign(t,nt);cambiadas++;}else if(!S.tpls.some(t=>norm(t.n)===norm(nt.n))){nt.id=newId('t');S.tpls.push(nt);nuevas++;}});
  notify('importacion',{titulo:'Plantillas de kit importadas desde Excel',texto:meName()+' importó '+T.file+': '+nuevas+' nuevas, '+cambiadas+' actualizadas.',para:admins()});
  T.applied={nuevas,cambiadas,freed,snap};commit();renderSheet(true);toast('Plantillas importadas.');}});
}
function undoTplImport(){
 const T=TIMP;if(!T||!T.applied||T.applied.undone)return;
 ask({title:'¿Deshacer la importación de plantillas?',ok:'Sí, deshacer',danger:true,html:'<p style="margin:0">Las plantillas y los kits vuelven a como estaban antes de importar. Los cambios en kits hechos después también se pierden.</p>',fn:()=>{const o=JSON.parse(T.applied.snap);S.tpls=o.tpls;S.kits=o.kits;T.applied.undone=true;kitPrev={};checkKits(true);commit();renderSheet(true);toast('Importación de plantillas deshecha.');}});
}

function navLayers(){return sheetStack.length+(document.body.classList.contains('drawer-on')?1:0);}
function navTab(t){try{if(NAVL){history.replaceState({tab:t,l:0},'','#'+t);NAVL=false;}else if(!history.state||history.state.tab!==t)history.pushState({tab:t,l:0},'','#'+t);}catch(e){}}
function navSync(){try{const n=navLayers();if(n&&!NAVL){history.pushState({tab,l:1},'','#'+tab);NAVL=true;}else if(!n&&NAVL){NAVL=false;NAV_IGN++;history.back();}}catch(e){}}
window.addEventListener('popstate',e=>{
 if(NAV_IGN>0){NAV_IGN--;return;}
 const st=e.state||{};
 if(NAVL){NAVL=false;
  if(loginOpen())return;

  if(document.body.classList.contains('drawer-on')){closeDrawer();return;}
  if(sheetStack.length){
   if(formDirty()){navSync();confirmLeave(()=>{sheetStack.pop();renderSheet(true);});return;}
   const top=sheetStack[sheetStack.length-1];const k=({sTpl:'tp',sPerson:'pe',sObra:'ob',sProd:'pr',sProfile:'pf',sKitEdit:'ke',sKitCheck:'kc',sAlm:'al'})[top.fn.name];if(k)G[k]=null;
   sheetStack.pop();renderSheet(true);return;}
 }

});

/* agrega el inventario inicial sin borrar modelos ni almacenes que ya existan */
function seedApply(sd){const have=new Set(S.prods.map(p=>p.np));S.prods=S.prods.concat(sd.prods.filter(p=>!have.has(p.np)));S.items=sd.items;S.movs=sd.movs;if(!S.alms||!S.alms.length)S.alms=sd.alms;}
function origenBad(t){return /cuaderno|en la foto|renglón|renglones/i.test(t||'');}
function cleanOriginLocal(){let ch=false;
 S.items.forEach(i=>{if('renglon' in i){delete i.renglon;ch=true;}if(i.obs&&origenBad(i.obs)){i.obs='';ch=true;}});
 S.movs.forEach(m=>{if(origenBad(m.por||'')){m.por='Carga inicial';ch=true;}if(origenBad(m.origen||'')){m.origen='Inventario inicial';ch=true;}if(origenBad(m.nota||'')){m.nota='Inventario inicial.';ch=true;}});
 return ch;}

 if(!FB_ON||!FBA||RO||!(ME.owner||FB_ADM))return;

  const fs=FBA.fs,del=firebase.firestore.FieldValue.delete();
  const [its,mvs]=await Promise.all(['items','movs'].map(c=>fs.collection(c).get({source:'server'})));

/* ---------- Respaldos: una copia diaria en la base (sin fotos) y copias completas en archivo ---------- */
const BK_KEEP=30,BK_EVERY=20*3600*1000,BK_CHUNK=300000;
let BK={list:null,busy:false,err:''};
function bkSnapshot(){const d={};COLS.forEach(c=>{d[c]=JSON.parse(JSON.stringify(colArr(c)||[]));});return d;}
function bkStrip(x){if(typeof x==='string')return x.indexOf('data:')===0&&x.length>500?'__img__':x;if(Array.isArray(x))return x.map(bkStrip);if(x&&typeof x==='object'){const o={};for(const k in x)o[k]=bkStrip(x[k]);return o;}return x;}
function bkMergeImgs(b,c){if(b==='__img__')return typeof c==='string'&&c.indexOf('data:')===0?c:null;if(Array.isArray(b))return b.map((x,i)=>bkMergeImgs(x,Array.isArray(c)?c[i]:undefined));if(b&&typeof b==='object'){const o={};for(const k in b)o[k]=bkMergeImgs(b[k],c&&typeof c==='object'?c[k]:undefined);return o;}return b;}
function bkCounts(d){return {equipos:(d.items||[]).length,movimientos:(d.movs||[]).length,kits:(d.kits||[]).length,personas:(d.people||[]).length};}
async function bkList(){const sn=await FBA.fs.collection('respaldos').where('meta','==',true).get();BK.list=sn.docs.map(x=>Object.assign({id:x.id},x.data())).sort((a,b)=>a.fecha<b.fecha?1:-1);return BK.list;}
/* espera a que todo lo guardado esté confirmado por el servidor: un respaldo a medio guardar no sirve */
async function bkIdle(ms){const t0=Date.now();while(Date.now()-t0<(ms||90000)){if(!WQ.size&&!wRunning){await new Promise(r=>setTimeout(r,1500));if(!WQ.size&&!wRunning)return true;}else await new Promise(r=>setTimeout(r,500));}return false;}
async function bkCreate(motivo){
 if(!(await bkIdle()))throw {code:'busy'};
 const data=bkStrip(bkSnapshot());const txt=JSON.stringify(data);
 const id='r'+nowIso().replace(/[^0-9]/g,'').slice(0,12)+gRand().slice(0,4);
 const col=FBA.fs.collection('respaldos');const n=Math.max(1,Math.ceil(txt.length/BK_CHUNK));
 for(let i=0;i<n;i++)await col.doc(id+'_'+i).set({meta:false,bk:id,n:i,data:txt.slice(i*BK_CHUNK,(i+1)*BK_CHUNK)});
 await col.doc(id).set({meta:true,fecha:nowIso(),por:meName()||ME.email||'',motivo:motivo||'Automático',partes:n,bytes:txt.length,cnt:bkCounts(data)});
 return id;
}
async function bkPrune(list){
 if(!FB_ADM||!list||list.length<=BK_KEEP)return;
 for(const b of list.slice(BK_KEEP)){try{for(let i=0;i<(b.partes||1);i++)await FBA.fs.collection('respaldos').doc(b.id+'_'+i).delete();await FBA.fs.collection('respaldos').doc(b.id).delete();}catch(e){}}
}
async function fbBackupTick(){
 if(!FB_ON||!FBA||RO||isPending()||BK.busy)return;
 if(!S.items.length&&!S.movs.length)return;
 BK.busy=true;
 try{let list=await bkList();const last=list[0];
  if((!last||Date.now()-Date.parse(last.fecha)>BK_EVERY)&&(S.items.length||S.movs.length)){await bkCreate('Automático');list=await bkList();}
  await bkPrune(list);BK.err='';
 }catch(e){BK.err=(e&&e.code)==='permission-denied'?'reglas':'red';}
 BK.busy=false;if(tab==='ajustes'&&ajTab==='respaldos')render();
}
async function bkLoad(b){let txt='';for(let i=0;i<(b.partes||1);i++){const d=await FBA.fs.collection('respaldos').doc(b.id+'_'+i).get();if(!d.exists)throw new Error('incompleto');txt+=d.data().data;}return JSON.parse(txt);}
function bkApply(data){
 COLS.forEach(c=>{const cur=new Map((colArr(c)||[]).map(o=>[o.id,o]));const arr=(data[c]||[]).map(o=>bkMergeImgs(o,cur.get(o.id)));
  if(c==='config'){if(arr[0])S.config=arr[0];}else S[c]=sortCol(c,arr);});
 if(!S.alms||!S.alms.length)S.alms=deriveAlms(S);normPeople();
}

/* ================= Inicio de sesión, menú lateral (☰), tema y animaciones ================= */

/* Curvas de nivel (topografía) generadas: fondo de la pantalla de entrada, del inicio y del menú */
/* Curvas de nivel reales: un relieve suave (colinas gaussianas deformadas) y sus isolíneas por marching squares.
   Las isolíneas de un mismo campo nunca se cruzan. Suavizado Chaikin para un trazo orgánico. */
function topoRng(seed){let s=seed|0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function topoModel(w,h,o){
 const R=topoRng(o.seed||11),M=Math.max(w,h);
 const waves=[];for(let i=0;i<7;i++){const a=R()*Math.PI*2,f=(0.7+R()*2.2)*2*Math.PI/M;waves.push([Math.cos(a)*f,Math.sin(a)*f,R()*Math.PI*2,0.35+R()*0.65]);}
 const wsum=waves.reduce((s,x)=>s+x[3],0);
 for(let i=0;i<6;i++){const a=R()*Math.PI*2,f=(3.5+R()*3.5)*2*Math.PI/M;waves.push([Math.cos(a)*f,Math.sin(a)*f,R()*Math.PI*2,(0.06+R()*0.08)*wsum/1.6]);}
 const warp=(x,y,ph)=>{let s=0;for(const q of waves)s+=q[3]*Math.sin(q[0]*x+q[1]*y+q[2]+ph);return s/wsum;};
 const H=o.hills.map(p=>({cx:p[0]*w,cy:p[1]*h,sx:p[2]*M,sy:p[3]*M,a:p[4],c:Math.cos(p[5]||0),s:Math.sin(p[5]||0)}));
 const W=(o.warp==null?0.085:o.warp)*M;
 return function(x,y){const wx=x+warp(x,y,0)*W,wy=y+warp(x,y,1.9)*W;let v=0;for(const p of H){const dx=wx-p.cx,dy=wy-p.cy,u=(dx*p.c+dy*p.s)/p.sx,q=(-dx*p.s+dy*p.c)/p.sy;v+=p.a*Math.exp(-(u*u+q*q)/2);}return v;};
}
function topoChaikin(pts,closed,it){
 for(let k=0;k<it;k++){const n=pts.length;if(n<3)return pts;const out=[];
  if(!closed)out.push(pts[0]);
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n];out.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);}
  if(!closed)out.push(pts[n-1]);pts=out;}
 return pts;
}
function topoLines(w,h,o){
 const f=topoModel(w,h,o),cs=o.cell||Math.max(6,Math.round(Math.max(w,h)/110));
 const pad=cs*2,x0=-pad,y0=-pad,nx=Math.ceil((w+2*pad)/cs)+1,ny=Math.ceil((h+2*pad)/cs)+1;
 const V=new Float64Array(nx*ny);let vmin=1e9,vmax=-1e9,pk=[0,0];
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=f(x0+i*cs,y0+j*cs);V[j*nx+i]=v;if(v<vmin)vmin=v;if(v>vmax){vmax=v;pk=[x0+i*cs,y0+j*cs];}}
 // afinar la cima
 let best=f(pk[0],pk[1]);for(let r=cs;r>0.5;r/=2){let moved=true;while(moved){moved=false;for(const d of [[r,0],[-r,0],[0,r],[0,-r]]){const v=f(pk[0]+d[0],pk[1]+d[1]);if(v>best){best=v;pk=[pk[0]+d[0],pk[1]+d[1]];moved=true;}}}}
 const n=o.levels||14,lo=vmin+(vmax-vmin)*(o.lo==null?0.04:o.lo),hi=vmax*(o.hi==null?0.94:o.hi),lines=[];
 for(let k=0;k<n;k++){
  const L=lo+(hi-lo)*(k/(n-1));
  const pt=new Map(),adj=new Map();
  const ep=(id,xa,ya,va,xb,yb,vb)=>{if(!pt.has(id)){const t=(L-va)/(vb-va);pt.set(id,[xa+(xb-xa)*t,ya+(yb-ya)*t]);}return id;};
  const link=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);(adj.get(b)||adj.set(b,[]).get(b)).push(a);};
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
   const a=V[j*nx+i],b=V[j*nx+i+1],c=V[(j+1)*nx+i+1],d=V[(j+1)*nx+i];
   const idx=(a>L?8:0)|(b>L?4:0)|(c>L?2:0)|(d>L?1:0);if(idx===0||idx===15)continue;
   const X=x0+i*cs,Y=y0+j*cs;
   const T=()=>ep('h'+i+'_'+j,X,Y,a,X+cs,Y,b),Rr=()=>ep('v'+(i+1)+'_'+j,X+cs,Y,b,X+cs,Y+cs,c),B=()=>ep('h'+i+'_'+(j+1),X,Y+cs,d,X+cs,Y+cs,c),Lf=()=>ep('v'+i+'_'+j,X,Y,a,X,Y+cs,d);
   const ctr=(a+b+c+d)/4>L;
   switch(idx){
    case 1:case 14:link(Lf(),B());break;
    case 2:case 13:link(B(),Rr());break;
    case 3:case 12:link(Lf(),Rr());break;
    case 4:case 11:link(T(),Rr());break;
    case 6:case 9:link(T(),B());break;
    case 7:case 8:link(Lf(),T());break;
    case 5:if(ctr){link(Lf(),T());link(B(),Rr());}else{link(Lf(),B());link(T(),Rr());}break;
    case 10:if(ctr){link(T(),Rr());link(Lf(),B());}else{link(Lf(),T());link(B(),Rr());}break;
   }
  }
  const used=new Set();
  const walk=(start)=>{const seq=[start];used.add(start);let cur=start,prev=null;for(;;){const nb=(adj.get(cur)||[]).filter(x=>x!==prev);const nxt=nb.find(x=>!used.has(x));if(nxt==null){const closed=nb.includes(start)&&seq.length>2;return {seq,closed};}used.add(nxt);seq.push(nxt);prev=cur;cur=nxt;}};
  // primero los extremos abiertos (grado 1), luego los anillos
  for(const [id,nb] of adj)if(nb.length===1&&!used.has(id)){const r=walk(id);lines.push({k,closed:false,pts:r.seq.map(x=>pt.get(x))});}
  for(const id of adj.keys())if(!used.has(id)){const r=walk(id);lines.push({k,closed:true,pts:r.seq.map(x=>pt.get(x))});}
 }
 return {lines,peak:pk,cs};
}
function topoPathD(pts,closed){const s=topoChaikin(pts,closed,2);let d='M'+s[0][0].toFixed(1)+' '+s[0][1].toFixed(1);for(let i=1;i<s.length;i++)d+='L'+s[i][0].toFixed(1)+' '+s[i][1].toFixed(1);return d+(closed?'Z':'');}
var TOPO_CACHE;
function topoSvg(w,h,o){
 TOPO_CACHE=TOPO_CACHE||new Map();o=o||{};const key=w+'x'+h+JSON.stringify(o);
 if(!TOPO_CACHE.has(key)){
  const r=topoLines(w,h,{seed:o.seed,levels:o.levels,hills:o.hills,warp:o.warp,lo:o.lo,hi:o.hi});
  const n=o.levels||14;let p='';
  r.lines.forEach(L=>{p+='<path pathLength="1" style="--i:'+(n-L.k)+'"'+((L.k%5)===4?' class="ix"':'')+' d="'+topoPathD(L.pts,L.closed)+'"/>';});
  TOPO_CACHE.set(key,{p,peak:r.peak});
 }
 const t=TOPO_CACHE.get(key);
 return '<svg class="topo'+(o.cls?' '+o.cls:'')+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="'+(o.par||'xMidYMid')+' slice" aria-hidden="true"><g class="topo-l">'+t.p+'</g>'
  +(o.fix?fixMark(t.peak[0],t.peak[1],o.fixS||1):'')+'</svg>';
}
function fixMark(x,y,k){
 const r0=(7*k).toFixed(1),r1=(46*k).toFixed(1),rc=(5.5*k).toFixed(1),rh=(13*k).toFixed(1),still=rm();
 const wave=d=>'<circle class="fix-r" r="'+r0+'">'+(still?'':'<animate attributeName="r" values="'+r0+';'+r1+'" dur="2.8s" begin="'+d+'s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".2 .6 .3 1"/><animate attributeName="opacity" values=".95;0" dur="2.8s" begin="'+d+'s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="'+(2.6*k).toFixed(1)+';'+(0.6*k).toFixed(1)+'" dur="2.8s" begin="'+d+'s" repeatCount="indefinite"/>')+'</circle>';
 return '<g class="fix" transform="translate('+x.toFixed(0)+' '+y.toFixed(0)+')">'+wave(0)+wave(1.4)
  +'<circle class="fix-h" r="'+rh+'">'+(still?'':'<animate attributeName="opacity" values=".22;.06;.22" dur="1.6s" repeatCount="indefinite"/>')+'</circle>'
  +'<circle class="fix-c" r="'+rc+'">'+(still?'':'<animate attributeName="opacity" values="1;.45;1" dur="1.6s" repeatCount="indefinite"/>')+'</circle>'
  +'<circle class="fix-dot" r="'+(1.8*k).toFixed(1)+'"/></g>';
}

 +'<div class="grid2"><div class="field"><label class="lab" for="ie-np">N° de parte</label><input id="ie-np" data-ie="np" value="'+esc(e.np)+'" list="ie-nps" autocomplete="off"><datalist id="ie-nps">'+S.prods.map(p=>'<option value="'+esc(p.np)+'">'+esc(p.nombre)+'</option>').join('')+'</datalist></div>'
 +(n>1?'<div class="field"><span class="lab">Series</span><button class="btn" type="button" data-act="serList" data-id="'+id+'">'+serInfo(g.map(x=>x.id)).con+' de '+n+' asignadas · Editar</button></div></div>':'<div class="field"><label class="lab" for="ie-s">Serie</label><input id="ie-s" data-ie="serie" value="'+esc(e.serie)+'" placeholder="Sin asignar" autocomplete="off" spellcheck="false"></div></div>')
 +'<div class="grid2"><div class="field"><label class="lab" for="ie-m">Marca</label><input id="ie-m" data-ie="marca" value="'+esc(e.marca)+'" list="ie-ms"><datalist id="ie-ms">'+marcas.map(m=>'<option value="'+esc(m)+'">').join('')+'</datalist></div>'
 +'<div class="field"><label class="lab" for="ie-c">Categoría</label><select id="ie-c" data-ie="cat">'+catOpts(e.cat,true)+'</select></div></div>'
 +'<div class="field"><label class="lab" for="ie-cond">Condición</label><select id="ie-cond" data-ie="cond">'+opts(['Operativo','Dañado','En reparación','De baja'],e.cond)+'</select></div>'
 +'<div class="field"><label class="lab" for="ie-o">Nota</label><textarea id="ie-o" data-ie="obs" rows="2" placeholder="Ej. Revisar el largo, etiqueta despegada">'+esc(e.obs)+'</textarea></div>'
 +'<p class="small muted" style="margin:0">El cambio queda registrado en el historial a nombre de <b>'+esc(meName())+'</b>.</p>'
 +'<div class="actions"><button class="btn primary" data-act="itemEditSave">Guardar cambios</button><button class="btn ghost" data-act="back">Cancelar</button></div>'};
}
sItemEdit.isForm=true;
function saveItemEdit(){
 if(guard('registrar'))return;const e=G.ie;const it=item(e.id);if(!it)return;const g=groupOf(it);const single=g.length===1;
 const nom=(e.nombre||'').trim(),np=(e.np||'').trim(),ser=(e.serie||'').trim();
 if(!nom){toast('Escribe el nombre del artículo.','bad');return;}
 if(!np){toast('Escribe el N° de parte.','bad');return;}
 if(single&&ser){const o=S.items.find(x=>x.id!==it.id&&x.serie&&serKey(x.serie)===serKey(ser));if(o){toast('Esa serie ya la tiene '+o.code+' ('+esc(o.nombre)+').','bad',5000);return;}}
 const ch=[];const lab={nombre:'nombre',np:'N° de parte',serie:'serie',marca:'marca',cat:'categoría',cond:'condición',obs:'nota'};
 const nv={nombre:nom,np,marca:(e.marca||'').trim()||it.marca,cat:e.cat,cond:e.cond,obs:(e.obs||'').trim()};if(single)nv.serie=ser;
 Object.keys(nv).forEach(f=>{if(String(it[f]||'')!==String(nv[f]||''))ch.push(lab[f]);});
 if(!ch.length){G.ie=null;closeSheet();toast('No hubo cambios.');return;}
 const k=kitOf(it.id);
 if(k&&nv.np!==it.np){const t=tplOf(k);const ix=k.slots.indexOf(it.id);if(t.slots[ix]&&!t.slots[ix].nps.includes(nv.np)){toast('Ese N° de parte no se acepta en '+esc(k.code)+'. Quita primero el equipo del kit.','bad',6000);return;}}
 const prev=it.cond;
 g.forEach(x=>Object.assign(x,nv));
 newMov({tipo:'Edición de datos',por:meName(),origen:'Ficha del equipo',destino:clone(it.loc),items:g.map(x=>x.id),nota:'Cambió: '+ch.join(', ')+'.'});
 if(nv.cond!=='Operativo'&&prev==='Operativo')notify('danado',{titulo:it.nombre+' '+sn(it)+' marcado como '+nv.cond,texto:meName()+' cambió la condición. Ubicación: '+locText(it.loc)+'.',para:admins()});
 G.ie=null;commit();closeSheet();toast(single?'Equipo actualizado.':plural(g.length,'unidad actualizada','unidades actualizadas')+'.');
}
/* ---------- Dar de baja una unidad ---------- */
function bajaItem(id){
 if(guard('registrar'))return;const it=item(id);if(!it)return;
 // en un grupo sin serie se elige cuántas unidades: primero las que no están en un kit
 const g=groupOf(it).filter(x=>x.cond!=='De baja'&&x.loc.t!=='transito').sort((a,b)=>(kitOf(a.id)?1:0)-(kitOf(b.id)?1:0)||codeNum(a.code)-codeNum(b.code));const n=g.length;const pick=n>1&&g.some(x=>x.serie);
 ask({title:n>1?'Dar de baja unidades':'¿Dar de baja?',ok:'Dar de baja',danger:true,html:'<p style="margin:0 0 10px"><b>'+esc(it.nombre)+'</b> · '+esc(n>1?n+' unidades en '+locShort(it.loc):sn(it))+'. Queda'+(n>1?'n':'')+' en el inventario como “De baja” y deja'+(n>1?'n':'')+' de estar disponible'+(n>1?'s':'')+'.</p>'
  +(pick?'<span class="lab" style="margin:0 0 4px">Cuáles</span><div class="bj-list">'+g.map(x=>'<label class="chkline"><input type="checkbox" data-bj="'+x.id+'"> <span class="mono">'+esc(x.code)+'</span> · '+esc(sn(x))+'</label>').join('')+'</div>'
   :n>1?'<div class="bj-q"><span class="lab" style="margin:0">Cuántas</span>'+qstep(['bjDec','bjInc','','id="bj-q"'],1,n,'unidades a dar de baja')+'</div>':'')
  +'<div class="field"><label class="lab" for="bj-n">Motivo</label><textarea id="bj-n" rows="2" placeholder="Ej. Conector roto, irreparable"></textarea></div><p class="small muted" style="margin:0">Si fue un error, se corrige con “Editar” › Condición.</p>',fn:()=>{
  const nota=(($('#bj-n')||{}).value||'').trim();const q=n>1?Math.max(1,Math.min(n,+(($('#bj-q')||{}).value)||1)):1;const sel=pick?g.filter(x=>{const c=document.querySelector('[data-bj="'+x.id+'"]');return c&&c.checked;}):n>1?g.slice(0,q):[it];if(!sel.length){toast('Marca al menos una unidad.','bad');return;}
  sel.forEach(x=>{const k=kitOf(x.id);if(k){const ix=k.slots.indexOf(x.id);k.slots[ix]=null;k.mod=k.mod||[];k.mod.push({fecha:nowIso(),por:meName(),texto:slotOf(tplOf(k),ix).l+': se dio de baja '+sn(x)+'.'});}x.cond='De baja';});
  newMov({tipo:'Baja',por:meName(),origen:locShort(it.loc),destino:clone(it.loc),items:sel.map(x=>x.id),nota:nota||'Dado de baja.'});
  commit();toast(sel.length>1?plural(sel.length,'unidad dada de baja','unidades dadas de baja')+': '+esc(it.nombre)+'.':esc(it.nombre)+' dado de baja.');}});
 setTimeout(()=>{const t=$('#bj-n');if(t)t.focus();},60);
}
/* varias unidades seleccionadas en el inventario */
function bajaMany(ids){
 if(guard('registrar'))return;const its=ids.map(item).filter(x=>x&&x.cond!=='De baja'&&x.loc.t!=='transito');const skip=ids.length-its.length;
 if(!its.length){toast('Ninguno de los seleccionados se puede dar de baja (ya están de baja o en tránsito).','bad');return;}
 ask({title:'Dar de baja '+plural(its.length,'equipo','equipos'),ok:'Dar de baja',danger:true,html:itemsSum(its.map(x=>x.id))+(skip?'<p class="small muted" style="margin:8px 0 0">'+plural(skip,'seleccionado no se incluye','seleccionados no se incluyen')+' (ya de baja o en tránsito).</p>':'')+'<div class="field" style="margin-top:12px"><label class="lab" for="bj-n">Motivo</label><textarea id="bj-n" rows="2" placeholder="Ej. Conector roto, irreparable"></textarea></div>',fn:()=>{
  const nota=(($('#bj-n')||{}).value||'').trim();
  its.forEach(x=>{const k=kitOf(x.id);if(k){const ix=k.slots.indexOf(x.id);k.slots[ix]=null;k.mod=k.mod||[];k.mod.push({fecha:nowIso(),por:meName(),texto:slotOf(tplOf(k),ix).l+': se dio de baja '+sn(x)+'.'});}x.cond='De baja';});
  newMov({tipo:'Baja',por:meName(),origen:[...new Set(its.map(x=>locShort(x.loc)))].join(' + '),destino:clone(its[0].loc),items:its.map(x=>x.id),nota:nota||'Dado de baja.'});
  sel.clear();commit();toast(plural(its.length,'equipo dado de baja','equipos dados de baja')+'.');}});
 setTimeout(()=>{const t=$('#bj-n');if(t)t.focus();},60);
}

/* ---------- Eventos ---------- */
let lp={t:0,x:0,y:0,el:null,fired:0};
document.addEventListener('contextmenu',e=>{
 if(Date.now()-lp.fired<900){e.preventDefault();return;}
 if(e.target.closest('input,textarea,select,[contenteditable]'))return;
 const r=ctxTarget(e.target);if(!r)return;
 e.preventDefault();openCtx(r.dataset.act,r.dataset.id,{x:e.clientX,y:e.clientY,row:r});
});
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;const r=ctxTarget(e.target);if(!r)return;
 const p=e.touches[0];clearTimeout(lp.t);lp.x=p.clientX;lp.y=p.clientY;lp.el=r;
 lp.t=setTimeout(()=>{lp.fired=Date.now();lp.hold=true;try{navigator.vibrate&&navigator.vibrate(12);}catch(er){}openCtx(r.dataset.act,r.dataset.id,{x:lp.x,y:lp.y,row:r});},480);
},{passive:true});
document.addEventListener('touchmove',e=>{if(!lp.t)return;const p=e.touches[0];if(Math.abs(p.clientX-lp.x)>10||Math.abs(p.clientY-lp.y)>10){clearTimeout(lp.t);lp.t=0;}},{passive:true});
// al soltar el dedo tras abrir el menú, ese toque no debe elegir la opción que quedó debajo
document.addEventListener('touchend',e=>{clearTimeout(lp.t);lp.t=0;if(lp.hold){lp.hold=false;lp.until=Date.now()+450;if(e.cancelable)e.preventDefault();}},{passive:false});
document.addEventListener('touchcancel',()=>{clearTimeout(lp.t);lp.t=0;if(lp.hold){lp.hold=false;lp.until=Date.now()+450;}},{passive:true});
/* tras abrir con pulsación larga, el “clic” que sigue no debe abrir la ficha; y cualquier opción cierra el menú */
document.addEventListener('click',e=>{
 if(lp.hold||Date.now()<(lp.until||0)||(Date.now()-lp.fired<700&&!e.target.closest('#ctx'))){e.preventDefault();e.stopPropagation();return;}
 const b=e.target.closest&&e.target.closest('[data-act]');
 if(b&&b.closest('#ctx')&&b.dataset.act!=='ctxClose')closeCtx();
},true);
document.addEventListener('keydown',e=>{
 const el=$('#ctx');
 if(el&&!el.hidden){
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();const r=CTX&&CTX.row;closeCtx(true);if(r)try{r.focus();}catch(er){}return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const its=[...el.querySelectorAll('.ctx-i')];let i=its.indexOf(document.activeElement);i=e.key==='ArrowDown'?(i+1)%its.length:(i-1+its.length)%its.length;its[i].focus();return;}
 }
 if((e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))&&document.activeElement){const r=ctxTarget(document.activeElement);if(r){e.preventDefault();const b=r.getBoundingClientRect();openCtx(r.dataset.act,r.dataset.id,{x:b.left+24,y:b.top+b.height/2,row:r});}}
},true);
// el desplazamiento que el navegador hace justo al abrir (inercia, foco) no cierra el menú
window.addEventListener('scroll',e=>{if(!CTX||!isDesk()||Date.now()-CTX.t<450)return;if(e.target&&e.target.closest&&e.target.closest('#ctx'))return;closeCtx(true);},true);
window.addEventListener('resize',()=>{if(CTX)closeCtx(true);});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='A')return;
 const a=b.dataset.act,d=b.dataset;
 if(a==='ctx'){e.preventDefault();const row=b.closest('.rw,tr');openCtx(d.type,d.id,{anchor:b,row:row&&row.querySelector?(row.matches('tr')?row:row.querySelector('.row')):null});return;}
 if(a==='ctxClose'){closeCtx();return;}
 if(a==='itemEdit'){if(guard('registrar'))return;G.ie=null;return openSheet(sItemEdit,d.id);}
 if(a==='itemEditSave')return saveItemEdit();
 if(a==='ctxSend'){const it=item(d.id);if(!it)return;openForm('envio',groupOf(it).filter(x=>x.loc.t!=='transito'&&x.loc.t!=='instalado'&&x.cond!=='De baja').map(x=>x.id));return;}
 if(a==='ctxInst'){const it=item(d.id);if(!it)return;openForm('inst',[it.id]);return;}
 if(a==='condEditAny'){return condEditFree(d.id);}
 if(a==='ctxCopy'){copyText(d.t,'Copiado: '+d.t);return;}
 if(a==='ctxBaja')return bajaItem(d.id);
 if(a==='bjDec'||a==='bjInc'){const inp=$('#bj-q');if(!inp)return;const mx=+inp.max||1;let v=(+inp.value||1)+(a==='bjInc'?1:-1);v=Math.max(1,Math.min(mx,v));inp.value=v;const st=inp.closest('.qstep');st.querySelector('[data-act="bjDec"]').disabled=v<=1;st.querySelector('[data-act="bjInc"]').disabled=v>=mx;return;}
 // cantidades en el selector de equipos
 if(a==='pqDec'||a==='pqInc'){const inp=document.querySelector('[data-pq="'+d.id+'"]');if(!inp)return;const mx=+inp.max||1;let v=(+inp.value||1)+(a==='pqInc'?1:-1);v=Math.max(1,Math.min(mx,v));inp.value=v;const st=inp.closest('.qstep');st.querySelector('[data-act="pqDec"]').disabled=v<=1;st.querySelector('[data-act="pqInc"]').disabled=v>=mx;return;}
 if(a==='pickAddN'){const it=item(d.id);if(!it)return;const inp=document.querySelector('[data-pq="'+d.id+'"]');const q=Math.max(1,Math.min(+((inp||{}).value)||1,999));const ids=S.items.filter(x=>!F.items.includes(x.id)&&eligible(x)&&grpKey(x)===grpKey(it)).map(x=>x.id).slice(0,q);ids.forEach(id=>F.items.push(id));refreshPicker();toast(plural(ids.length,'unidad agregada','unidades agregadas')+': '+esc(it.nombre)+'.','',2600);return;}
 if(a==='selDec'||a==='selInc'){const g=SELG[+d.g];if(!g)return;if(a==='selDec'){if(g.ids.length<=1)return;const id=g.ids[g.ids.length-1];F.items=F.items.filter(x=>x!==id);F.pk=(F.pk||[]).filter(x=>x!==id);}else{const av=availFor(g.key);if(!av.length)return;F.items.push(av[0]);}refreshPicker();return;}
 if(a==='pickRmG'){const g=SELG[+d.g];if(!g)return;F.items=F.items.filter(x=>!g.ids.includes(x));F.pk=(F.pk||[]).filter(x=>!g.ids.includes(x));if(F.kit&&kitById(F.kit)&&g.ids.some(id=>kitById(F.kit).slots.includes(id)))F.kit=null;refreshPicker();return;}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.pkg!=null){const g=SELG[+el.dataset.pkg];if(!g)return;F.pk=(F.pk||[]).filter(x=>!g.ids.includes(x));if(el.checked)F.pk.push(...g.ids);refreshPicker();return;}
 if(el.dataset.selq!=null){const g=SELG[+el.dataset.selq];if(!g)return;const want=Math.max(1,Math.min(+el.value||1,+el.max||1));const cur=g.ids.length;
  if(want<cur){const drop=g.ids.slice(want);F.items=F.items.filter(x=>!drop.includes(x));F.pk=(F.pk||[]).filter(x=>!drop.includes(x));}
  else if(want>cur){availFor(g.key).slice(0,want-cur).forEach(id=>F.items.push(id));}
  refreshPicker();return;}
 if(el.dataset.pq!=null){const mx=+el.max||1;el.value=Math.max(1,Math.min(mx,+el.value||1));return;}
 if(el.tagName==='SELECT'&&el.dataset.ie&&G.ie){G.ie[el.dataset.ie]=el.value;return;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.ie&&G.ie)G.ie[el.dataset.ie]=el.value;});
document.addEventListener('keydown',e=>{const el=e.target;if(e.key==='Enter'&&el&&el.dataset&&el.dataset.pq!=null){e.preventDefault();const b=document.querySelector('[data-act="pickAddN"][data-id="'+el.dataset.pq+'"]');if(b)b.click();}});
/* condición para cualquier persona que registra (antes solo administradores) */
function condEditFree(id){
 if(guard('registrar'))return;const i=item(id);if(!i)return;
 ask({title:'Cambiar condición',ok:'Guardar',html:'<p style="margin:0 0 10px">'+esc(i.nombre)+' · '+esc(sn(i))+'</p><div class="seg">'+['Operativo','Dañado','En reparación','De baja'].map(v=>'<label><input type="radio" name="cnd" value="'+v+'"'+(i.cond===v?' checked':'')+'><span>'+v+'</span></label>').join('')+'</div>',fn:()=>{
  const v=(document.querySelector('input[name="cnd"]:checked')||{}).value;if(!v||v===i.cond)return;const prev=i.cond;i.cond=v;
  newMov({tipo:'Edición de datos',por:meName(),origen:'Ficha del equipo',destino:clone(i.loc),items:[i.id],nota:'Condición: '+prev+' → '+v+'.'});
  if(v!=='Operativo'&&prev==='Operativo')notify('danado',{titulo:i.nombre+' '+sn(i)+' marcado como '+v,texto:meName()+' cambió la condición a '+v+'. Ubicación: '+locText(i.loc)+'.',para:admins()});
  commit();toast('Condición actualizada.');}});
}

})();
</script>
