<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Rumbo · Inventario Maquitop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111C25" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Rumbo">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Rumbo: inventario de equipos de machine control de Maquitop.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head><body>

<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de una columna pensada para celular. Cabecera oscura tipo placa de máquina, listas con divisores, hojas a pantalla completa, barra inferior fija. */
/* Layout: celular = una columna con barra inferior; computadora = barra lateral fija, contenido en dos columnas y fichas en panel lateral. Colores de marca Maquitop (azul #0082C0). */
:root{
  --bg:#f2f6f9; --surface:#ffffff; --surface-2:#e6eef4; --ink:#16222e; --muted:#5b6977; --line:#d5e0e8;
  --head:#ffffff; --head-ink:#16222e; --head-muted:#5b6977;
  --accent:#0082c0; --accent-ink:#ffffff; --accent-soft:#e1f1fa; --accent-strong:#006a9e;
  --ok:#1f7a45; --ok-bg:#e1f2e7; --warn:#9a5a00; --warn-bg:#fcefd6; --bad:#b8321a; --bad-bg:#fbe3dc; --info:#0071a8; --info-bg:#e1f1fa;
  --ill-1:#2f4150; --ill-2:#d3dee6; --ill-3:#0082c0; --scr:#9dd0ec;
  --scrim:rgba(14,30,44,.32);
  --f-disp:"Nunito","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c141c; --surface:#131e29; --surface-2:#1c2a37; --ink:#e6edf3; --muted:#93a3b2; --line:#263646;
    --head:#131e29; --head-ink:#e6edf3; --head-muted:#93a3b2;
    --accent:#2ea3e0; --accent-ink:#04121c; --accent-soft:#0f2a3d; --accent-strong:#5bb8ea;
    --ok:#5cc88a; --ok-bg:#13301f; --warn:#f0ab45; --warn-bg:#33260f; --bad:#f2876a; --bad-bg:#3a1c14; --info:#6cc0ef; --info-bg:#0f2a3d;
    --ill-1:#b5c6d3; --ill-2:#2a3b4a; --ill-3:#2ea3e0; --scr:#2f5f7e;
    --scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c141c; --surface:#131e29; --surface-2:#1c2a37; --ink:#e6edf3; --muted:#93a3b2; --line:#263646;
  --head:#131e29; --head-ink:#e6edf3; --head-muted:#93a3b2;
  --accent:#2ea3e0; --accent-ink:#04121c; --accent-soft:#0f2a3d; --accent-strong:#5bb8ea;
  --ok:#5cc88a; --ok-bg:#13301f; --warn:#f0ab45; --warn-bg:#33260f; --bad:#f2876a; --bad-bg:#3a1c14; --info:#6cc0ef; --info-bg:#0f2a3d;
  --ill-1:#b5c6d3; --ill-2:#2a3b4a; --ill-3:#2ea3e0; --scr:#2f5f7e;
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.small{font-size:13px}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabecera */
.top{background:var(--head);color:var(--head-ink)}
.top .wrap{padding-block:14px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:.06em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12px;color:var(--head-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.who label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-muted)}
.who select{background:transparent;color:var(--head-ink);border:1px solid transparent;border:1px solid color-mix(in srgb,var(--head-ink) 30%,transparent);border-radius:8px;padding:6px 8px;font-size:15px;max-width:100%}
.who select option{color:#1b2226;background:#fff}
.demo{background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.demo .wrap{padding-block:7px}

/* Vista */
main{padding-block:18px 120px}
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.sec-t{font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
.count{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.empty{margin:0;padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat .n{font-family:var(--f-disp);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat[data-grp="transito"] .n{color:var(--warn)}
.note-bad{border:0;background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:14px;padding:10px 12px;border-radius:8px;text-align:left}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.list > .row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2);background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.rmain{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rname{font-weight:600;font-size:15px;line-height:1.3}
.rdate{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rsub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.thumb,.kthumb{flex:none;width:58px;height:46px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.thumb svg,.kthumb svg{width:100%;height:100%}
.thumb img{width:100%;height:100%;object-fit:cover}
.mico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.mico svg{width:18px;height:18px}
.mico.envio{background:var(--warn-bg);color:var(--warn)}
.mico.inst{background:var(--ok-bg);color:var(--ok)}
.mico.cambio{background:var(--info-bg);color:var(--info)}
.mico.ret{background:var(--bad-bg);color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-neutral::before{display:none}

.bubble{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px 3px 4px;border-radius:999px;background:var(--ok);color:var(--surface)}
.bubble svg{width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--ok);padding:3px}
.bubble.big{font-size:15px;padding:5px 14px 5px 5px}
.bubble.big svg{width:26px;height:26px;padding:5px}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.prog{display:block;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog.full span{background:var(--ok)}

/* Inventario */
.search input,.field input,.field select,.field textarea,.filters select{width:100%;font-size:16px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.field textarea{resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:8px;align-items:center;margin-block:8px 10px}
.filters select{flex:1;min-width:0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;padding:13px}
.btn.danger{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Hojas */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet-head h2{margin:0;font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.sheet-body{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.photo{position:relative;border-radius:12px;background:var(--surface-2);aspect-ratio:4/3;max-width:100%;overflow:hidden;display:grid;place-items:center}
.photo svg{width:72%;height:auto}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-btn{position:absolute;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
.h1{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.dl dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dl dd{margin:0;overflow-wrap:anywhere}
.where{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.where .big{font-weight:600;font-size:16px}
.lab{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.field{display:flex;flex-direction:column;min-width:0}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;top:0;right:0;bottom:0;left:0;inset:0}
.seg span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer}
.seg input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sel{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.selitem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.selitem .thumb{width:44px;height:36px}
.selitem .rmain{gap:1px}
.x{flex:none;border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}
.pickres{margin-top:8px}
.pickres .row{padding:9px 12px}
.pickres .thumb{width:44px;height:36px}
.addtag{flex:none;align-self:center;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:3px 8px;font-size:12.5px}
.boleta{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;object-fit:contain;align-self:flex-start}
.tl{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li.on::before{border-color:var(--accent);background:var(--accent)}
.tl button{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.slot{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot-l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot .row{padding:0;border:0}
.slot .row:hover{background:none}
.slot-a{display:flex;gap:6px;flex-wrap:wrap}
.slot.missing{background:var(--warn-bg);background:color-mix(in srgb,var(--warn-bg) 55%,transparent)}
.kstatus{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.kstatus p{margin:0}
.wa{width:100%;font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:190px;resize:vertical}
.done-ico{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.done-ico svg{width:28px;height:28px}
.menu{display:grid;gap:10px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.menu b{display:block;font-size:16px}
.menu span.d{font-size:13px;color:var(--muted)}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.guide .box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}
.tplcard{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tplcard:last-child{border-bottom:0}
.reset{display:flex;justify-content:center}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.tabs .plus span.c{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tabs .plus span.c svg{color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}

/* Ilustraciones */
.s1{fill:var(--ill-1)}
.s2{fill:var(--ill-2);stroke:var(--ill-1);stroke-width:2}
.s3{fill:var(--ill-3)}
.scr{fill:var(--scr)}
.ln{fill:none;stroke:var(--ill-3);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.coil{fill:none;stroke:var(--ill-1);stroke-width:5}
.ant{stroke:var(--ill-1);stroke-width:4;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
[hidden]{display:none!important}

/* --- Demo 2 --- */
.toast{z-index:90}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:70;background:rgba(8,12,14,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.modal{align-items:center}}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:470px;max-height:86vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mbox h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1.1}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mact .btn{flex:1 1 140px}
.sum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.recbox{display:flex;flex-direction:column;gap:4px;background:var(--info-bg);border-radius:12px;padding:12px 14px;font-size:14px}
.recbox p{margin:0}
.recbox .lab{color:var(--info);margin:0}
.errs{margin:0;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px 10px 30px;font-size:14px;font-weight:500}
.info{margin:0;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row.selrow{background:transparent;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.row.selrow:hover{background:transparent;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.radio{flex:none;align-self:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.selrow .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 42%,var(--surface) 46%)}
.row.dis{cursor:default;opacity:.8}
.row.dis:hover{background:transparent}
details.nocomp{margin-top:8px}
details.nocomp summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:6px 0;font-weight:500}
details.nocomp .list{margin-top:6px}
.bols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bol{display:flex;flex-direction:column;gap:6px;min-width:0}
.bsvg{width:100%;max-width:360px;height:auto;display:block;border-radius:8px}
.bol img.boleta,.field img.boleta{max-width:100%;max-height:240px;object-fit:contain;border-radius:8px;border:1px solid var(--line);align-self:flex-start}
.bol .empty{margin:0}
.chk{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--ok)}
.chk .thumb{width:44px;height:36px}
.lockbox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface)}
.lockbox p{margin:0}
.recv{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;border:2px solid var(--accent);background:var(--surface)}
.recv .lab{margin:0}
.chkline{display:flex;gap:10px;align-items:center;font-size:14px}
.chkline input{width:18px;height:18px;accent-color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px}
.steps .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.steps .txt b{font-size:15px}
.steps .txt span{font-size:13.5px;color:var(--muted)}
.steps .btn{align-self:flex-start}
.sub-t{margin:0;font-size:13px;color:var(--muted)}
.rcpt{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rcpt:last-child{border-bottom:0}
.tpl-slot{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.tpl-slot:first-of-type{border-top:0}
.tpl-slot .mono{white-space:nowrap}
details.tpl{padding:12px 14px;border-bottom:1px solid var(--line)}
details.tpl:last-child{border-bottom:0}
details.tpl summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
details.tpl summary::-webkit-details-marker{display:none}
details.tpl[open] summary{margin-bottom:8px}
.whobar{display:flex;gap:6px;flex-wrap:wrap}
.bubble{white-space:nowrap;flex:none}

/* --- Marca y escritorio --- */
.logo{display:block;height:30px;aspect-ratio:490/87;max-width:100%;background:var(--logo) no-repeat left center/contain}
.top{border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent)}
.top .wrap{align-items:center;padding-block:14px 12px}
.brand{gap:6px}
.brand span{color:var(--head-muted);font-family:var(--f-disp);font-weight:700;letter-spacing:.06em}
.sec-t{font-weight:800;letter-spacing:.05em}
.h1,.mbox h3,.stat .n,.sheet-head h2,.steps .num{font-weight:800}
.stat .n{color:var(--accent)}
.stat[data-grp="transito"] .n{color:var(--warn)}
.stat:hover,.row:hover{background:var(--accent-soft);background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.chip[aria-pressed="true"],.seg input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn:hover{border-color:var(--accent)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.tabs .plus span.c{box-shadow:0 4px 14px transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.side-brand,.side-who{display:none}
.scrim{display:none}
.home{display:flex;flex-direction:column}
.home > .col{display:flex;flex-direction:column;min-width:0}

@media (min-width:1024px){
  body{padding-left:248px}
  .wrap{max-width:1200px}
  .top .brand{display:none}
  .top .wrap{justify-content:flex-end}
  .who{flex-direction:row;align-items:center;gap:10px}
  .who label{white-space:nowrap}
  main{padding-block:26px 48px}
  .tabs{top:0;bottom:0;left:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--line);padding-bottom:0;padding-top:env(safe-area-inset-top,0px);overflow-y:auto}
  .tabs .wrap{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:22px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));max-width:none;min-height:100%}
  .side-brand{display:flex;flex-direction:column;gap:6px;order:-2;padding:4px 6px 22px}
  .side-brand .logo{height:34px}
  .side-brand span{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;font-weight:600;padding:10px 12px;border-radius:10px;color:var(--muted)}
  .tabs button:hover{background:var(--surface-2);color:var(--ink)}
  .tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .tabs .plus{order:-1;margin:0 0 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;justify-content:center;padding:12px}
  .tabs .plus:hover{background:var(--accent-strong);color:var(--accent-ink)}
  .tabs .plus span.c{width:auto;height:auto;margin:0;background:none;box-shadow:none;color:inherit}
  .tabs .plus span.c svg{color:inherit;width:20px;height:20px}
  .side-who{display:block;margin-top:auto;padding:14px 6px 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
  .side-who b{display:block;color:var(--ink);font-size:14px}
  .toast{bottom:28px;left:calc(50% + 124px)}
  /* Fichas como panel lateral */
  .sheet{left:auto;width:min(640px,calc(100vw - 248px));border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.18)}
  .sheet .wrap{max-width:none}
  .scrim{display:block;position:fixed;top:0;right:0;bottom:0;left:0;inset:0;left:248px;z-index:39;background:var(--scrim)}
  body.locked{overflow:auto}
  /* Dos columnas */
  .home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .home .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .list.cols > .row:nth-child(odd){border-right:1px solid var(--line)}
  .filters,.search,.chips{max-width:none}
}

/* --- v4: escritorio, tablas y Excel --- */
.gsearch{display:none}
.only-desk{display:none!important}
.tabs button{position:relative}
.nbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.invbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.invbar .chips{padding:0;flex:1 1 auto;min-width:0}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.invfilters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-block:8px 10px}
.invfilters .chips{flex:1 1 320px;min-width:0;padding:0}
.invfilters select{flex:0 1 240px;min-width:0;font-size:15px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.search.inv-search{margin-top:4px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--surface-2);text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0;white-space:nowrap}
.tbl th .th{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;width:100%;padding:10px 12px}
.tbl th .th:hover{color:var(--ink)}
.tbl th .th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl th .th span{font-size:10px;opacity:.6}
.tbl th[aria-sort] .th{color:var(--accent)}
.tbl th[aria-sort] .th span{opacity:1}
.tbl th.num .th{justify-content:flex-end}
.tbl .nosort{display:block;padding:10px 12px}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--accent-soft)}
.tbl tbody tr[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}
.tbl .art{display:flex;gap:10px;align-items:center;min-width:220px}
.tbl .art .thumb{width:44px;height:34px}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-family:var(--f-body)}
.tbl .rmeta{margin:0}
.tt{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.mico.sm{width:26px;height:26px}
.mico.sm svg{width:14px;height:14px}
.xcard{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xcard:last-child{border-bottom:0}
.xcard .rmain{flex:1 1 240px}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:30px 18px;border:2px dashed var(--line);border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;background:var(--surface);cursor:pointer;color:var(--muted);transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink);font-size:16px}

/* ===== v5: rediseño ===== */
:root{--shadow:0 1px 2px rgba(16,40,60,.06),0 2px 8px rgba(16,40,60,.04);--shadow-lg:0 12px 40px rgba(16,40,60,.16)}

.acctbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px 4px 4px;cursor:pointer;max-width:240px;min-width:0}

.acct-t span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;font-family:var(--f-disp)}

.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;flex:none}

/* cabeceras de página */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:14px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}

.kpi{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;align-items:center;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi-ic{grid-row:1/3;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.kpi-n{font-family:var(--f-disp);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}

.bars{display:flex;flex-direction:column;gap:6px}

.row.att .rname{font-size:14.5px}

/* tablas */

.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px)}

.bulk .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* buscador global */
.gsearch{position:relative}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:70vh;overflow:auto;padding:6px}
.gr-sec{display:flex;flex-direction:column;padding:4px 0}
.gr-t{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 10px}
.gr{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;width:100%;color:var(--ink)}

.gr>span:last-child{display:flex;flex-direction:column;min-width:0}
.gr b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr span span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr.all{justify-content:center;font-weight:700;color:var(--accent);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.gr-empty{padding:16px;color:var(--muted)}
/* hojas */
.sheet-head .wrap{gap:12px}
.donehead{display:flex;gap:14px;align-items:center}
.itemtop{display:flex;flex-direction:column;gap:14px}
.itemhead{display:flex;flex-direction:column;gap:10px;min-width:0}
.formgrid{display:grid;grid-template-columns:1fr;gap:18px}
.fcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.alertbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-size:14px}

.bolbox{gap:8px}
.bolph{display:flex;gap:10px;align-items:center;padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}

.mail{display:flex;flex-direction:column;gap:6px;padding:14px;border-bottom:1px solid var(--line)}
.list>.mail:last-child{border-bottom:0}

.tbl.cfg input[type=text],.tbl.cfg input:not([type]),.tbl.cfg input[type=email]{width:100%;min-width:150px;font-size:14px;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}

.inl{display:inline-flex;gap:6px;align-items:center;font-size:14px}

.sled{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.sled-h input{flex:1;min-width:0;font-size:15px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.back{white-space:nowrap;flex:none}
