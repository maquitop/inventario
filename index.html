/* ===== v6: avisos con X, perfil, a cargo, permisos, controles de kit, Android y navegadores ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,select,summary,.row,.kpi,.chip,tr[data-act]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sheet,.tablewrap,.gres{-webkit-overflow-scrolling:touch}
input,select,textarea,button{font-family:inherit}
@media (max-width:1023px){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px}}

/* aviso emergente: texto, acción y X */
.toast{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;transition:opacity .15s,transform .15s;will-change:transform;transform:translate(calc(-50% + var(--dx,0px)),var(--dy,0px))}
.toast.drag{transition:none}
.toast[hidden]{display:none!important}
.toast .tmsg{flex:1 1 auto;min-width:0;line-height:1.35}
.toast .tact{flex:none;border:0;background:rgba(255,255,255,.16);color:inherit;font-weight:800;font-size:13.5px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.toast .tact:hover{background:rgba(255,255,255,.26)}
.toast .tx{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:inherit;font-size:15px;line-height:1;cursor:pointer;opacity:.8;display:grid;place-items:center}
.toast .tx:hover,.toast .tx:focus-visible{opacity:1;background:rgba(255,255,255,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast:not(.bad) .tact,:root:not([data-theme="light"]) .toast:not(.bad) .tx:hover{background:rgba(0,0,0,.08)}}
:root[data-theme="dark"] .toast:not(.bad) .tact{background:rgba(0,0,0,.08)}

/* menú y navegación según permisos */
.tabs .plus.dim .c{opacity:.55}
.tabs [hidden]{display:none!important}

/* tarjeta "A tu cargo" en Inicio y perfil */
.cargocard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;text-align:left;border:1px solid var(--line);cursor:pointer;color:inherit;font:inherit}
.cargocard:hover{border-color:var(--accent)}
.cargocard .tt{display:flex;gap:12px;align-items:center}
.cargocard .sub{display:block;color:var(--muted);font-size:13px;font-weight:400}
.profcard{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.profcard>.tt{display:flex;gap:14px;align-items:center}
.dl.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.tt{display:inline-flex;gap:8px;align-items:center}
.nivseg{flex-wrap:wrap}

/* kits */
.kitbar{margin-top:0}
.kc.on{background:var(--ok-bg)}
.kc.miss{opacity:.7}
.kc input{accent-color:var(--ok)}
.xpick{display:flex;gap:8px;align-items:center;flex:1 1 260px;justify-content:flex-end}
.xpick select{flex:1 1 auto;min-width:0;max-width:280px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* revisión de empaque en envíos */
.pkhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;margin-bottom:8px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.pkhead>span{display:block;flex:1 1 220px}
.pkhead svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.pkhead.ok{background:var(--ok-bg);color:var(--ok)}
.pkhead .linkbtn{color:inherit}
.pkc{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;min-width:44px}
.pkc input{width:22px;height:22px;accent-color:var(--ok);margin:0}
.selitem.packed{border-color:var(--ok);background:var(--ok-bg)}
.selitem.packed .pkc{color:var(--ok)}
.ic14{width:14px;height:14px;vertical-align:-2px}

/* plantillas importadas */
.tplc .sum{margin:4px 0 0}
.tplc .errs{margin:6px 0 0}
.sum.small li{font-size:13px}

@media (max-width:1023px){
  .toast{left:12px;right:12px;transform:translate(var(--dx,0px),var(--dy,0px));max-width:none;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .xpick{justify-content:stretch}
  .xpick select{max-width:none}
}

/* ===================================================================
   v7 · Rediseño "plano de obra"
   Azul Maquitop + azul noche de pantalla de control + amarillo maquinaria.
   Tipografía Barlow (señalética vial) y Barlow Semi Condensed.
   =================================================================== */
:root{
  --f-disp:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EBEFF3; --surface:#FFFFFF; --surface-2:#E3E9EF; --ink:#0F2230; --muted:#56687A; --line:#D3DCE4;
  --head:#FFFFFF; --head-ink:#0F2230; --head-muted:#56687A;
  --accent:#0082C0; --accent-ink:#FFFFFF; --accent-soft:#DCEFFA; --accent-strong:#006A9E;
  --night:#0B2232; --night-2:#123247; --night-ink:#E9F2F8; --night-muted:#9DB6C8; --night-line:rgba(255,255,255,.09);
  --signal:#FFB71B; --signal-ink:#2A1D00; --signal-soft:#FFF1CC;
  --topo:rgba(0,130,192,.16);
  --shadow:0 1px 1px rgba(15,34,48,.04),0 2px 6px rgba(15,34,48,.05);
  --shadow-lg:0 18px 50px rgba(11,34,50,.22);
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141D; --surface:#0F1F2B; --surface-2:#16293A; --ink:#E6EEF4; --muted:#93A8B9; --line:#213547;
    --head:#0F1F2B; --head-ink:#E6EEF4; --head-muted:#93A8B9;
    --accent:#2FA6E6; --accent-ink:#04131D; --accent-soft:#0E2C40; --accent-strong:#6BC2F0;
    --night:#06111A; --night-2:#0D2232;
    --signal:#FFC23F; --signal-soft:#3A2C08;
    --topo:rgba(47,166,230,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#08141D; --surface:#0F1F2B; --surface-2:#16293A; --ink:#E6EEF4; --muted:#93A8B9; --line:#213547;
  --head:#0F1F2B; --head-ink:#E6EEF4; --head-muted:#93A8B9;
  --accent:#2FA6E6; --accent-ink:#04131D; --accent-soft:#0E2C40; --accent-strong:#6BC2F0;
  --ok:#5cc88a; --ok-bg:#13301f; --warn:#f0ab45; --warn-bg:#33260f; --bad:#f2876a; --bad-bg:#3a1c14; --info:#6cc0ef; --info-bg:#0f2a3d;
  --night:#06111A; --night-2:#0D2232;
  --signal:#FFC23F; --signal-soft:#3A2C08;
  --topo:rgba(47,166,230,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

body{font-family:var(--f-body);font-size:15.5px;line-height:1.45;letter-spacing:.005em;font-feature-settings:"tnum" 0}
.h1,.mbox h3,.sheet-head h2,.kpi-n,.sec-t,.rname,.btn,.chip{font-family:var(--f-disp)}
.h1{font-weight:700;letter-spacing:-.01em}
.mono,.rsub.mono,code{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* títulos de sección: sin mayúsculas sostenidas */
.sec-t{text-transform:none;letter-spacing:0;font-weight:700;font-size:20px;color:var(--ink)}
.sec-t .count{font-family:var(--f-body);font-weight:600;font-size:13px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:999px;letter-spacing:0}
.lab{letter-spacing:.02em}
.sheet-head h2{text-transform:none;letter-spacing:0;font-weight:700;font-size:21px}
.recbox .lab,.lab{text-transform:none;font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--muted)}

/* superficies */
.card,.list,.tablewrap,.kpi,.dl,.kstatus,.recv,.lockbox,.mail,.tplc,.imp,.where,.emptybox{border-radius:var(--r)}
.list{overflow:hidden}
.row{transition:background-color .15s}
.tbl tbody tr{transition:background-color .15s}

/* botones */
.btn{border-radius:var(--r-sm);font-weight:600;font-size:15px;letter-spacing:.01em;transition:transform .12s var(--ease),background-color .15s,border-color .15s,box-shadow .15s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 14px -6px rgba(0,130,192,.7)}
.btn.sm{font-size:14px}
.chip{font-weight:600;font-size:14.5px;transition:background-color .15s,color .15s,border-color .15s,transform .12s}
.chip:active{transform:scale(.96)}
.linkbtn{font-family:var(--f-disp);font-size:inherit}
.pill{font-family:var(--f-body)}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:35;box-shadow:none;border-bottom:1px solid var(--line);background:var(--head);background:color-mix(in srgb,var(--head) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.top .wrap{padding-block:10px}
.menubtn{flex:none}
.menubtn svg{width:22px;height:22px}
.menubtn .nbadge{right:-5px;top:-5px}
.iconbtn{border-radius:12px;transition:background-color .15s,border-color .15s,transform .12s}
.iconbtn:active{transform:scale(.94)}
.iconbtn:hover{border-color:var(--accent)}
.acctbtn{border-radius:12px;transition:border-color .15s}
.acctbtn:hover{border-color:var(--accent)}
.brand>span:last-child{display:none}
.logo.on-plate,.top .brand .logo{background-color:#fff;background-origin:content-box;box-sizing:content-box;padding:5px 9px;border-radius:9px;height:22px;box-shadow:0 0 0 1px rgba(15,34,48,.08)}
@media (max-width:1023px){
  .top{background:var(--night);border-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--night-ink)}
  .top .iconbtn,.top .acctbtn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:var(--night-ink)}
  .top .brand{flex:1;min-width:0}
  .top .brand .logo{height:20px;padding:5px 8px}
  .sync{background:rgba(255,255,255,.1);color:var(--night-muted)}
  .demo{font-size:12.5px}
}

/* ---------- barra lateral de escritorio ---------- */
@media (min-width:1024px){
  .tabs{background:var(--night);border-right:0;color:var(--night-ink)}
  .tabs .wrap{padding:20px 14px}
  .side-brand{padding:2px 4px 22px}
  .side-brand .logo{height:24px;background-color:#fff;background-origin:content-box;box-sizing:content-box;padding:7px 11px;border-radius:10px}
  .side-brand span{color:var(--night-muted);font-family:var(--f-disp);letter-spacing:.02em;text-transform:none;font-size:13.5px;font-weight:600;padding-left:2px}
  .tabs button{color:var(--night-muted);font-family:var(--f-disp);font-size:16.5px;font-weight:600;position:relative;transition:background-color .15s,color .15s}
  .tabs button:hover{background:rgba(255,255,255,.06);color:var(--night-ink)}
  .tabs button[aria-current="page"]{background:rgba(0,130,192,.22);color:#fff}
  .tabs button[aria-current="page"] svg{color:var(--signal)}
  .tabs button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--signal)}
  .tabs .plus{background:var(--accent);color:#fff;font-size:17px;box-shadow:0 8px 24px -10px rgba(0,130,192,.9)}
  .tabs .plus:hover{background:var(--accent-strong);color:#fff}
  .tabs .sep{border-color:var(--night-line);background:var(--night-line)}
  .tabs .nbadge{position:static;margin-left:auto}
  .side-who{border-top-color:var(--night-line);color:var(--night-muted)}
  .side-who b{color:var(--night-ink)}
  .top{background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom-color:transparent}
  .top .wrap{gap:12px}
  .gsearch{background:var(--surface);border-radius:12px}
}
/* barra inferior del celular */
@media (max-width:1023px){
  .tabs{background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top-color:var(--line)}
  .tabs button{font-family:var(--f-disp);font-size:12.5px;font-weight:600;transition:color .15s}
  .tabs button svg{transition:transform .2s var(--ease)}
  .tabs button[aria-current="page"] svg{transform:translateY(-2px)}
  .tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:-2px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:var(--signal)}
  .tabs .plus span.c{width:52px;height:52px;margin-top:-24px;box-shadow:0 0 0 5px var(--bg),0 10px 22px -6px rgba(0,130,192,.8);transition:transform .15s var(--ease)}
  .tabs .plus:active span.c{transform:scale(.92)}
}

/* ---------- entrada de cada vista ---------- */
#view.enter>*{animation:rise .32s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.04s}
#view.enter>*:nth-child(3){animation-delay:.08s}
#view.enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- inicio: banda topográfica ---------- */
.hero-home{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:26px 26px 24px;margin:0 0 18px;border-radius:20px;background:var(--night);color:var(--night-ink);box-shadow:var(--shadow-lg)}
.hero-home .topo{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;z-index:-1;color:rgba(120,190,232,.28)}
.hero-home::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:-1;background:linear-gradient(100deg,var(--night) 30%,rgba(11,34,50,.35) 75%,rgba(11,34,50,.1))}
.hh-date{margin:0 0 6px;font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--night-muted);text-transform:none}
.hero-home .h1{font-size:40px;line-height:1;color:#fff;font-weight:800}
.hero-home .lead{color:var(--night-muted);margin:8px 0 18px;font-size:16.5px}
.hero-home .quick .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}
.hero-home .quick .btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.hero-home .quick .btn.primary{background:var(--accent);border-color:var(--accent)}
.hh-rec{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:200px;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--night-ink);text-align:left;cursor:pointer;font:inherit;transition:transform .15s var(--ease),background-color .15s}
.hh-rec:hover{background:rgba(255,255,255,.1)}
.hh-rec:active{transform:scale(.98)}
.hh-rec.on{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.hh-n{font-family:var(--f-disp);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.hh-l{font-family:var(--f-disp);font-weight:700;font-size:17px}
.hh-s{font-size:13.5px;opacity:.8}
@media (max-width:699px){
  .hero-home{grid-template-columns:1fr;padding:20px 18px;border-radius:18px;margin-inline:-4px}
  .hero-home .h1{font-size:32px}
  .hh-rec{flex-direction:row;align-items:center;gap:10px;min-width:0;padding:12px 14px}
  .hh-n{font-size:34px}
  .hh-s{display:none}
}
.hello{display:none}

/* topografía */
.topo .topo-l path{fill:none;stroke:currentColor;stroke-width:1.1;vector-effect:non-scaling-stroke}
.topo .fix-c{fill:var(--signal)}
.topo .fix-r{fill:none;stroke:var(--signal);stroke-width:2}
.topo .fix-h{fill:var(--signal);opacity:.2}
.topo .fix-dot{fill:#fff}
@keyframes fix{from{transform:scale(1);opacity:.9}to{transform:scale(5.5);opacity:0}}
.hero-home .topo-l{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-40px,12px)}}

/* indicadores */
.kpis{gap:12px}
.kpi{padding:16px;transition:transform .15s var(--ease),border-color .15s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(15,34,48,.4)}
.kpi:active{transform:scale(.98)}
.kpi-ic{border-radius:12px}
.kpi-n{font-size:34px;font-weight:800;letter-spacing:-.01em}
.kpi-l{font-family:var(--f-disp);font-size:15px;font-weight:600}
.bar-t span{transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.prog span{transform-origin:left;animation:grow .6s var(--ease) both}

/* ---------- menú ☰ ---------- */
.dscrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:80;background:var(--scrim);opacity:0;transition:opacity .22s}
.dscrim.open{opacity:1}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:81;width:min(360px,88vw);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);transform:translateX(-104%);transition:transform .26s var(--ease);overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dr-head{position:relative;overflow:hidden;isolation:isolate;background:var(--night);color:var(--night-ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;flex-direction:column;gap:16px}
.dr-head .topo{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;z-index:-1;color:rgba(120,190,232,.22)}
.dr-top{display:flex;align-items:center;justify-content:space-between}
.dr-top .logo{height:20px}
.dr-close{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:16px;cursor:pointer}
.dr-me{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.dr-me b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:700;color:#fff}
.dr-me span span{display:block;font-size:14px;color:var(--night-muted)}
.dr-body{padding:14px 14px 20px;display:flex;flex-direction:column;gap:6px}
.dr-search{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.dr-search svg{width:18px;height:18px}
.dr-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 6px}
.dr-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit;transition:transform .12s var(--ease),border-color .15s}
.dr-tile:active{transform:scale(.97)}
.dr-tile:hover{border-color:var(--accent)}
.dr-tile b{font-family:var(--f-disp);font-size:16px;font-weight:700;line-height:1.15;margin-top:6px}
.dr-tile span:not(.dt-ic){font-size:13px;color:var(--muted)}
.dt-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.dt-ic svg{width:19px;height:19px}
.dr-tile.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dr-tile.pri span:not(.dt-ic){color:rgba(255,255,255,.82)}
.dr-tile.pri .dt-ic{background:rgba(255,255,255,.16);color:#fff}
.dr-tile.hot{background:var(--signal-soft);border-color:var(--signal)}
.dr-tile.hot .dt-ic{background:var(--signal);color:var(--signal-ink)}
.dr-h{margin:14px 6px 4px;font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--muted)}
.dr-nav{display:flex;flex-direction:column}
.dr-link{display:flex;align-items:center;gap:12px;padding:11px 10px;border:0;border-radius:10px;background:none;color:var(--ink);font-family:var(--f-disp);font-size:17px;font-weight:600;text-align:left;cursor:pointer;transition:background-color .15s}
.dr-link svg{width:20px;height:20px;color:var(--muted);flex:none}
.dr-link:hover{background:var(--surface-2)}
.dr-link.on{background:var(--accent-soft);color:var(--accent)}
.dr-link.on svg{color:var(--accent)}
.dr-link em{margin-left:auto;font-style:normal;font-family:var(--f-body);font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:11px;display:grid;place-items:center;background:var(--bad);color:#fff}
.dr-theme{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 6px 4px;font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--muted)}
.dr-seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.dr-seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-family:var(--f-disp);font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.dr-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dr-out{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 10px;border:0;border-top:1px solid var(--line);background:none;color:var(--bad);font-family:var(--f-disp);font-size:16px;font-weight:700;cursor:pointer;text-align:left}
.dr-out svg{width:20px;height:20px}
body.drawer-on{overflow:hidden}

/* ---------- pantalla de entrada ---------- */
body.authing{overflow:hidden}
body.authing .top,body.authing .tabs,body.authing main,body.authing #banner{visibility:hidden}
.login{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.lg{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lg-art{position:relative;overflow:hidden;isolation:isolate;background:var(--night);color:var(--night-ink);padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:100vh}
.lg-art .topo{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;z-index:-1;color:rgba(120,190,232,.30)}
.lg-art::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,34,50,.1) 0%,rgba(11,34,50,.0) 40%,rgba(11,34,50,.85) 100%)}
.lg-brand .logo{height:28px;padding:8px 12px;border-radius:11px}
.lg-copy{max-width:520px}
.lg-copy h1{margin:0;font-family:var(--f-disp);font-weight:800;font-size:64px;line-height:.98;letter-spacing:-.015em;color:#fff;text-wrap:balance}
.lg-copy>p{margin:16px 0 0;font-size:19px;line-height:1.45;color:var(--night-muted);max-width:44ch}
.lg-facts{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.lg-facts li{display:flex;align-items:center;gap:12px;font-size:16.5px;color:var(--night-ink)}
.lg-facts svg{width:20px;height:20px;flex:none;padding:7px;box-sizing:content-box;border-radius:10px;background:rgba(255,183,27,.14);color:var(--signal)}
.lg-foot{margin:0;font-size:13.5px;color:var(--night-muted)}
.lg-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.lg-card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
.lg-card h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.01em}
.lg-sub{margin:-6px 0 0;color:var(--muted);font-size:15.5px}
.lg-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.lg-seg button{border:0;background:none;padding:10px;border-radius:9px;font-family:var(--f-disp);font-weight:700;font-size:16px;color:var(--muted);cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s}
.lg-seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lg-form{display:flex;flex-direction:column;gap:12px}
.lg-form.swap{animation:rise .28s var(--ease) both}
.lg-form .field input,.lg-form .field select{border-radius:11px;padding:12px 13px;background:var(--surface)}
.lg-form .field input:focus,.lg-form .field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.lg-go{margin-top:4px;padding:15px;font-size:17px}
.lg-help{margin:0;color:var(--muted);font-size:15px}
.lg-people{display:flex;flex-direction:column;gap:8px;max-height:min(56vh,520px);overflow-y:auto;padding:2px}
.lg-person{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,transform .12s var(--ease),box-shadow .15s}
.lg-person:hover{border-color:var(--accent);box-shadow:0 8px 20px -14px rgba(0,130,192,.8)}
.lg-person:active{transform:scale(.985)}
.lp-t{flex:1;min-width:0}
.lp-t b{display:block;font-family:var(--f-disp);font-size:17px;font-weight:700}
.lp-t span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-go svg{width:18px;height:18px;color:var(--accent)}
/* la entrada: las curvas se dibujan y el texto aparece, una sola vez */
.lg.intro .topo-l path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards;animation-delay:calc(var(--i) * 45ms)}
.lg.intro .lg-copy,.lg.intro .lg-card{animation:rise .55s var(--ease) both .25s}
.lg.intro .lg-card{animation-delay:.4s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:899px){
  .lg{grid-template-columns:1fr}
  .lg-art{min-height:0;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 26px;gap:22px}
  .lg-copy h1{font-size:40px}
  .lg-copy>p{font-size:16.5px;margin-top:10px}
  .lg-facts{display:none}
  .lg-foot{display:none}
  .lg-panel{padding:22px 18px calc(32px + env(safe-area-inset-bottom,0px));align-items:flex-start}
  .lg-card h2{font-size:30px}
}

/* fichas y ventanas */
.sheet{transition:none}
@media (min-width:1024px){.sheet:not([hidden]){animation:slidein .26s var(--ease)}}
@media (max-width:1023px){.sheet:not([hidden]){animation:slideup .26s var(--ease)}}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideup{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.modal:not([hidden]) .mbox{animation:pop .2s var(--ease)}
@keyframes pop{from{transform:scale(.96) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.toast:not([hidden]){animation:toastin .25s var(--ease)}
@keyframes toastin{from{opacity:0;margin-bottom:-12px}to{opacity:1;margin-bottom:0}}
.done-ico{animation:pop .35s var(--ease) both}
.done-ico svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:check .45s .15s var(--ease) forwards}
@keyframes check{to{stroke-dashoffset:0}}
.toast{font-family:var(--f-body);border-radius:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .topo .fix-r{display:none}
}
.topo .fix{pointer-events:none}
.dr-head,.dr-body{flex:none}
@media (max-width:1023px){.top .brand .logo{display:inline-block;width:auto;max-width:none}}
@media (max-width:1023px){.top .brand{align-items:flex-start;justify-content:center}.top .brand .logo{align-self:flex-start}}
.hero-home .quick .btn.primary,.dr-tile.pri,.dr-tile.pri b{color:var(--accent-ink)}
.dr-tile.pri span:not(.dt-ic){color:var(--accent-ink);opacity:.82}
.dr-tile.pri .dt-ic{color:var(--accent-ink)}
@media (min-width:1024px){.tabs .plus,.tabs .plus:hover{color:var(--accent-ink)}}
:root[data-theme="dark"] .hero-home{border:1px solid var(--line);background:#0B1D2A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-home{border:1px solid var(--line);background:#0B1D2A}}

/* ===================================================================
   v8 · Rediseño profesional
   IBM Plex Sans / Plex Mono · neutros fríos · azul Maquitop como único acento
   barra lateral azul noche · densidad de software de gestión
   =================================================================== */
:root{
  --f-disp:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F4F6F8; --surface-3:#E9EDF1; --line:#E1E6EB; --line-strong:#C9D2DA;
  --ink:#15212B; --ink-2:#334251; --muted:#5F6E7D;
  --head:#FFFFFF; --head-ink:#15212B; --head-muted:#5F6E7D;
  --accent:#0082C0; --accent-ink:#FFFFFF; --accent-soft:#E6F2F9; --accent-strong:#006A9E;
  --ok:#1C7A4D; --ok-bg:#E4F3EB; --warn:#985A00; --warn-bg:#FCF1DB; --bad:#B23A22; --bad-bg:#FBE7E2; --info:#0A6FA3; --info-bg:#E6F2F9;
  --night:#0F1D29; --night-2:#16293A; --night-ink:#E8EFF5; --night-muted:#93A6B7; --night-line:rgba(255,255,255,.08);
  --signal:#F2A900; --signal-ink:#2A1D00; --signal-soft:#FDF3D6;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg:0 20px 40px -12px rgba(16,24,40,.25);
  --r:10px; --r-sm:8px;
  --scrim:rgba(15,29,41,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B131A; --surface:#111C25; --surface-2:#15222D; --surface-3:#1C2B38; --line:#22313E; --line-strong:#2F4252;
    --ink:#E5ECF2; --ink-2:#C3CFDA; --muted:#8C9CAB; --head:#111C25; --head-ink:#E5ECF2; --head-muted:#8C9CAB;
    --accent:#3AA9E3; --accent-ink:#06131C; --accent-soft:#0F2B3D; --accent-strong:#73C3EE;
    --ok:#5BC489; --ok-bg:#122C1E; --warn:#EDAA4A; --warn-bg:#30240F; --bad:#EF8A70; --bad-bg:#371B14; --info:#6CC0EF; --info-bg:#0F2B3D;
    --night:#0A141C; --night-2:#111F2B;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 16px -4px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0B131A; --surface:#111C25; --surface-2:#15222D; --surface-3:#1C2B38; --line:#22313E; --line-strong:#2F4252;
  --ink:#E5ECF2; --ink-2:#C3CFDA; --muted:#8C9CAB; --head:#111C25; --head-ink:#E5ECF2; --head-muted:#8C9CAB;
  --accent:#3AA9E3; --accent-ink:#06131C; --accent-soft:#0F2B3D; --accent-strong:#73C3EE;
  --ok:#5BC489; --ok-bg:#122C1E; --warn:#EDAA4A; --warn-bg:#30240F; --bad:#EF8A70; --bad-bg:#371B14; --info:#6CC0EF; --info-bg:#0F2B3D;
  --night:#0A141C; --night-2:#111F2B;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 6px 16px -4px rgba(0,0,0,.5);
}

/* ---------- base ---------- */
body{font-family:var(--f-body);font-size:14px;line-height:1.5;letter-spacing:0;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@media (max-width:1023px){body{font-size:15px}}
.h1{font-family:var(--f-disp);font-weight:600;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.lead{font-size:13.5px;color:var(--muted)}
.small{font-size:12.5px}
.mono,code{font-family:var(--f-mono);font-size:.9em;letter-spacing:0}
.sec{margin:0 0 22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.sec-h .sec-t{margin:0}
.sec-t{font-family:var(--f-disp);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.sec-t .count{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-3);padding:1px 8px;border-radius:999px}
.sub-t{font-size:13px;color:var(--muted)}
.linkbtn{font-family:var(--f-body);font-weight:600;color:var(--accent);text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.linkbtn.sm{font-size:13px}
.empty{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:14px 16px}
.lab,.recbox .lab{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:0;text-transform:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- superficies ---------- */
.card,.list,.tablewrap,.kpi,.dl,.kstatus,.recv,.lockbox,.mail,.tplc,.imp,.where,.emptybox,.kstrip{border-radius:var(--r);box-shadow:var(--shadow)}
.card,.list,.tablewrap{background:var(--surface);border:1px solid var(--line)}
.card.pad{padding:16px}
.recbox,.info{border-radius:var(--r);font-size:13.5px}
.dl{padding:14px 16px;border-color:var(--line)}
.dl dt{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.dl dd{font-size:14px}
.emptybox{border-style:dashed;border-color:var(--line-strong)}

/* ---------- botones y controles ---------- */
.btn{height:36px;padding:0 14px;border-radius:var(--r-sm);font-family:var(--f-body);font-weight:600;font-size:14px;letter-spacing:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);gap:7px;transition:background-color .12s,border-color .12s,box-shadow .12s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,80,130,.25)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.block{height:42px;width:100%}
.btn svg{width:16px;height:16px}
.chip{height:30px;padding:0 12px;border-radius:999px;font-family:var(--f-body);font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:var(--accent)}
.chips{gap:6px}
.seg input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg span{border-radius:var(--r-sm);font-size:13.5px}
.field input,.field select,.field textarea,.search input,.toolbar select,.xpick select{border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:var(--f-body)}
.field input,.field select,.toolbar select{min-height:38px}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus,.toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (min-width:1024px){.field input,.field select,.field textarea,.search input,.toolbar select{font-size:14px}}
.pill{font-family:var(--f-body);font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;letter-spacing:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- cabecera ---------- */
.top{background:var(--head);border-bottom:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--ink)}
.top .wrap{padding-block:10px;min-height:56px}
.iconbtn,.acctbtn{border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:none}
.iconbtn{width:38px;height:38px}
.iconbtn:hover,.acctbtn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.acct-t b{font-size:13px;font-weight:600}
.acct-t span{font-size:12px}
.avatar{font-family:var(--f-body);font-weight:600}
.gsearch{height:38px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.gsearch:focus-within{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gsearch input{font-size:14px}
.gsearch kbd{font-family:var(--f-mono);font-size:11px}
.demo{font-size:12.5px;border-bottom:1px solid #F1DDB3}
@media (max-width:1023px){
  .top{background:var(--head);color:var(--ink)}
  .top .iconbtn,.top .acctbtn{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .top .brand .logo{background-color:transparent;padding:0;box-shadow:none;height:24px}
  .sync{background:var(--surface-3);color:var(--muted)}
}
@media (min-width:1024px){
  .top{background:var(--head);border-bottom-color:var(--line)}
}

/* ---------- barra lateral ---------- */
@media (min-width:1024px){
  .tabs{background:var(--night);color:var(--night-ink);width:248px}
  .tabs .wrap{padding:18px 12px;gap:2px}
  .side-brand{padding:2px 4px 18px}
  .side-brand .logo{height:20px;padding:6px 10px;border-radius:8px}
  .side-brand span{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--night-muted);letter-spacing:.01em}
  .tabs button{font-family:var(--f-body);font-size:14px;font-weight:500;padding:8px 10px;border-radius:7px;color:var(--night-muted);gap:11px}
  .tabs button svg{width:18px;height:18px}
  .tabs button:hover{background:rgba(255,255,255,.05);color:var(--night-ink)}
  .tabs button[aria-current="page"]{background:rgba(255,255,255,.08);color:#fff}
  .tabs button[aria-current="page"] svg{color:#fff}
  .tabs button[aria-current="page"]::before{left:-12px;top:7px;bottom:7px;width:3px;background:var(--accent)}
  .tabs .plus{height:38px;margin:0 0 14px;font-size:14px;font-weight:600;border-radius:8px;background:var(--accent);color:#fff;box-shadow:none;justify-content:center}
  .tabs .plus:hover{background:var(--accent-strong);color:#fff}
  .tabs .sep{margin:10px 6px}
  .side-who{font-size:12px}
  .tabs .nbadge{background:var(--bad);color:#fff}
}
@media (max-width:1023px){
  .tabs{background:var(--surface);border-top:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabs button{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted)}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .tabs button[aria-current="page"] svg{color:var(--accent);transform:none}
  .tabs button[aria-current="page"]::after{display:none}
  .tabs .plus span.c{width:48px;height:48px;margin-top:-20px;box-shadow:0 0 0 4px var(--bg),0 6px 14px -4px rgba(0,100,160,.6);background:var(--accent)}
}

/* ---------- encabezados de página ---------- */
.pagehead{align-items:flex-end;margin-bottom:16px;padding-top:2px}
.pagehead .h1{font-size:22px}
.pagehead .lead{margin-top:2px}
.ph-date{margin:0 0 2px;font-size:12.5px;font-weight:500;color:var(--muted)}
.home-head .h1{font-size:24px}
.quick{gap:8px}
.listhead{font-size:12.5px;color:var(--muted)}
.toolbar{gap:8px;margin-bottom:10px}

/* ---------- inicio ---------- */
.hero-home{display:none}
.nextstep{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 0 16px;border-radius:var(--r);border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));background:var(--accent-soft);box-shadow:var(--shadow)}
.ns-ic{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.ns-ic svg{width:19px;height:19px}
.ns-t{flex:1;min-width:0}
.ns-t b{display:block;font-weight:600;font-size:14.5px;color:var(--ink)}
.ns-t span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.nextstep .btn{flex:none}
@media (max-width:640px){.nextstep{flex-wrap:wrap}.nextstep .btn{width:100%}}
.obra-pick{display:flex;gap:8px;align-items:flex-end}
.nlbox{display:flex;flex-direction:column;gap:10px;padding:12px 14px;margin:2px 0 12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2)}
.nlbox .grid2{margin:0}
.gate-who{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.gate-who b{display:block}.gate-who span span{display:block;font-size:13px;color:var(--ink-2)}
.tplcard .tt>span>b{display:block}.tplcard .tt>span>.sub{display:block;font-size:13px;color:var(--ink-2);font-weight:400}
.accmems{margin-top:12px}.accmems summary{cursor:pointer}.accmems .list{margin-top:10px}
.obra-pick .field{flex:1;min-width:0;margin:0}
.obra-empty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.obra-empty span{flex:1;min-width:200px}
.bj-q{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.pendbar{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;margin:0 0 16px;border-radius:var(--r);border:1px solid #EFD49A;background:var(--signal-soft);color:var(--ink);cursor:pointer;font:inherit;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.pendbar:hover{border-color:var(--signal);box-shadow:var(--shadow-md)}
.pb-ic{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--signal);color:var(--signal-ink)}
.pb-ic svg{width:19px;height:19px}
.pb-t{flex:1;min-width:0}
.pb-t b{display:block;font-weight:600;font-size:14.5px}
.pb-t span{display:block;font-size:13px;color:var(--ink-2)}
.pb-go{flex:none;font-weight:600;font-size:13.5px;color:var(--ink);padding:6px 12px;border-radius:7px;background:rgba(255,255,255,.7);border:1px solid #E8C774}
:root[data-theme="dark"] .pendbar{border-color:#5A4512}
:root[data-theme="dark"] .pb-go{background:transparent;border-color:#6E5617}
.kstrip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);margin:0 0 22px;overflow:hidden}
@media (min-width:700px){.kstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1280px){.kstrip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kc-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0;transition:background-color .12s}
.kc-cell:hover{background:var(--surface-2)}
.kc-l{font-size:12.5px;font-weight:500;color:var(--muted)}
.kc-cell .kpi-n{font-family:var(--f-disp);font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kc-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kc-cell.warn .kpi-n,.kc-cell.warn .kc-s{color:var(--warn)}
.kc-cell.bad .kpi-n{color:var(--bad)}
.bars{gap:4px}
.bar{padding:6px 4px;grid-template-columns:minmax(100px,160px) 1fr 40px}
.bar-l{font-size:13.5px;font-weight:500}
.bar-t{height:8px;border-radius:4px;background:var(--surface-3)}
.bar-t span{border-radius:4px}
.bar-n{font-weight:600;font-size:13.5px}

/* ---------- listas y filas ---------- */
.list .row,.row{padding:11px 14px;gap:12px;border-bottom:1px solid var(--line)}
.list>.row:last-child,.list>.rw:last-child,.list>.rw:last-child>.row{border-bottom:0}
.row:hover{background:var(--surface-2)}
.rname{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink)}
.rsub{font-size:13px;color:var(--muted)}
.rdate{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb,.kthumb{border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.mico{border-radius:9px}
.rw{display:flex;align-items:stretch;border-bottom:1px solid var(--line);position:relative}
.rw>.row{flex:1;min-width:0;border-bottom:0}
.rmore{flex:none;width:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;align-self:center;height:32px;margin-right:6px;transition:background-color .12s,color .12s}
.rmore svg{width:18px;height:18px}
.rmore:hover,.rmore:focus-visible{background:var(--surface-3);color:var(--ink)}
.btn.rmore-btn{width:36px;padding:0;margin:0;height:36px;color:var(--ink-2)}
.ctx-on,.row.ctx-on,tr.ctx-on td{background:var(--accent-soft)!important}
.row,tr[data-act]{-webkit-touch-callout:none}

/* ---------- tablas ---------- */
.tablewrap{overflow:auto;position:relative}
.tbl{font-size:13.5px}
.tbl th{background:var(--surface-2);border-bottom:1px solid var(--line);padding:9px 12px;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;white-space:nowrap}
.tbl th .th,.tbl th .nosort{font-family:var(--f-body);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl b{font-weight:600}
.tbl .sub{font-size:12.5px;color:var(--muted)}
.tbl td.mono{font-size:12.5px}
.tbl .actc{width:46px;padding:0 6px 0 0;text-align:right}
.tbl .actc .rmore{margin:0 0 0 auto;opacity:.55}
.tbl tr:hover .actc .rmore,.tbl .actc .rmore:focus-visible{opacity:1}

/* ---------- fichas y ventanas ---------- */
.sheet{background:var(--bg)}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .wrap{min-height:52px}
.sheet-head h2{font-family:var(--f-body);font-size:16px;font-weight:600;text-transform:none;letter-spacing:0}
.back{height:32px;border-radius:7px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.sheet .h1{font-size:21px}
.mbox{border-radius:12px;box-shadow:var(--shadow-lg)}
.mbox h3{font-family:var(--f-body);font-size:18px;font-weight:600}
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r);font-size:14px;box-shadow:var(--shadow-lg)}
:root[data-theme="dark"] .toast{background:#E5ECF2;color:#0B131A}
.kstatus{background:var(--surface);border:1px solid var(--line)}
.where{background:var(--surface);border:1px solid var(--line)}

/* ---------- cantidades ---------- */
.qstep{display:inline-flex;align-items:center;gap:0;margin-top:6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);overflow:hidden;width:max-content}
.qstep button{width:32px;height:32px;border:0;background:var(--surface-2);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;line-height:1}
.qstep button:hover:not([disabled]){background:var(--surface-3)}
.qstep button[disabled]{opacity:.35;cursor:not-allowed}
.qstep input{width:46px;height:32px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.qstep input::-webkit-outer-spin-button,.qstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qstep input:focus{outline:none;background:var(--accent-soft)}
.qmax{padding:0 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pickrow{cursor:default;align-items:center;flex-wrap:wrap}
.pickrow:hover{background:transparent}
.pickctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.pickctl .qstep{margin-top:0}
@media (max-width:599px){.pickctl{width:100%;justify-content:flex-end}}
.selitem .rmain{min-width:0}

/* ---------- menú contextual ---------- */
.ctxbd{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:94;background:transparent}
.ctxbd.dim{background:var(--scrim)}
.ctx{position:fixed;z-index:95;min-width:230px;max-width:320px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;opacity:0;transform:scale(.97);transform-origin:top left;transition:opacity .12s,transform .12s}
.ctx.open{opacity:1;transform:none}
.ctx-head{display:flex;flex-direction:column;gap:1px;padding:8px 10px 8px;border-bottom:1px solid var(--line);margin:0 0 4px}
.ctx-head b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-head span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:none;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.ctx-i svg{width:16px;height:16px;flex:none;color:var(--muted)}
.ctx-i:hover,.ctx-i:focus-visible{background:var(--surface-3);outline:none}
.ctx-i.danger,.ctx-i.danger svg{color:var(--bad)}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}
.ctx.sheet{left:0!important;right:0;top:auto!important;bottom:0;max-width:none;min-width:0;border-radius:16px 16px 0 0;padding:6px 10px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(100%);opacity:1;transition:transform .22s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow-y:auto}
.ctx.sheet.open{transform:none}
.ctx-grip{display:block;width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 6px}
.ctx.sheet .ctx-head{padding:6px 8px 12px}
.ctx.sheet .ctx-head b{font-size:15px}
.ctx.sheet .ctx-i{padding:13px 10px;font-size:15.5px}
.ctx.sheet .ctx-i svg{width:20px;height:20px}

/* ---------- menú ☰ ---------- */
.drawer{background:var(--surface)}
.dr-head{background:var(--night)}
.dr-me b{font-family:var(--f-body);font-size:16px;font-weight:600}
.dr-me span span{font-size:13px}
.dr-search{border-radius:8px;font-size:14px;background:var(--surface-2)}
.dr-tile{border-radius:10px;padding:12px}
.dr-tile b{font-family:var(--f-body);font-size:14px;font-weight:600}
.dr-tile span:not(.dt-ic){font-size:12.5px}
.dt-ic{width:30px;height:30px;border-radius:8px}
.dr-tile.hot{background:var(--signal-soft);border-color:#EBC873}
.dr-tile.hot .dt-ic{background:var(--signal);color:var(--signal-ink)}
.dr-h{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.dr-link{font-family:var(--f-body);font-size:14.5px;font-weight:500;padding:9px 10px;border-radius:8px}
.dr-link svg{width:18px;height:18px}
.dr-theme,.dr-seg button{font-family:var(--f-body)}
.dr-out{font-family:var(--f-body);font-size:14.5px;font-weight:600}

/* ---------- entrada ---------- */
.lg-copy h1{font-family:var(--f-disp);font-weight:600;font-size:46px;line-height:1.08;letter-spacing:-.02em}
.lg-copy>p{font-size:17px}
.lg-facts li{font-size:15px}
.lg-facts svg{background:rgba(58,169,227,.14);color:#7CC6EE}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow-md)}
.lg-card h2{font-family:var(--f-disp);font-weight:600;font-size:26px;letter-spacing:-.01em}
.lg-sub{font-size:14px}
.lg-seg button{font-family:var(--f-body);font-weight:600;font-size:14px}
.lg-go{height:44px;font-size:15px}
.lp-t b{font-family:var(--f-body);font-size:15px;font-weight:600}
.topo .fix-c{fill:#3AA9E3}
.topo .fix-r{stroke:#3AA9E3}
.topo .fix-h{fill:#3AA9E3}
@media (max-width:899px){
  .lg-copy h1{font-size:32px}
  .lg-card{padding:20px;border-radius:12px}
  .lg-panel{padding:16px 14px 28px}
}

/* ---------- kits, plantillas y varios ---------- */
.kitbar .btn{height:32px;font-size:13px}
.tplcard,.tplc{border-radius:var(--r)}
.alertbox{border-radius:var(--r)}
.nbadge{font-family:var(--f-body);font-weight:600}
#view.enter>*{animation-duration:.22s}
.done-ico{background:var(--ok-bg);color:var(--ok)}
.tbl td.mono,.tbl td .mono{white-space:nowrap}
.kc-cell{margin:0 -1px -1px 0}
.rsub.mono{font-size:12.5px}

/* ===================== Tema «placa de equipo» (2026) =====================
   Un solo lenguaje: formas muy redondeadas, tipografía condensada para títulos y cifras,
   azul Maquitop solo en la acción principal, azul marino para lo elegido, amarillo de señal para lo que espera. */
:root{
  --f-disp:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F4F7F9; --surface-3:#E8EDF1; --line:#E0E6EB; --line-strong:#CBD5DD;
  --ink:#0F1D29; --ink-2:#3B4C5A; --muted:#66788A;
  --tonal:color-mix(in srgb,var(--ink) 7%,var(--surface)); --tonal-2:color-mix(in srgb,var(--ink) 12%,var(--surface));
  --r:20px; --r-sm:14px; --r-xs:10px; --pill:999px;
  --shadow:none; --shadow-md:0 10px 24px -12px rgba(15,29,41,.18); --shadow-lg:0 24px 48px -16px rgba(15,29,41,.32);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);--shadow-md:0 10px 24px -10px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);--shadow-md:0 10px 24px -10px rgba(0,0,0,.6)}

body{font-family:var(--f-body);font-size:14.5px;letter-spacing:0}
@media (max-width:1023px){body{font-size:15px}}
.h1,.sec-t,.sheet-head h2,.mbox h3,.kpi-n,.kc-cell .kpi-n,.lg-card h2,.emptybox b,.drop b{font-family:var(--f-disp)}
.h1{font-weight:700;font-size:26px;letter-spacing:-.005em;line-height:1.1;text-wrap:balance}
.pagehead .h1{font-size:28px}
.sheet .h1{font-size:26px}
.sec-t{font-size:19px;font-weight:700}
.sec-t .count{font-family:var(--f-body);font-weight:600;font-size:12px;background:var(--surface-3);color:var(--ink-2);border-radius:var(--pill);padding:2px 9px}
.lead,.sub-t{font-size:14px}
.lab,.recbox .lab{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.sheet-head h2{font-family:var(--f-disp);font-size:19px;font-weight:700}
.mbox h3{font-size:24px;font-weight:700}
.mono,code,.rsub.mono,.tbl td.mono{font-family:var(--f-mono)}

/* superficies: un solo nivel, sin sombras repartidas */
.card,.list,.tablewrap,.kpi,.dl,.kstatus,.recv,.lockbox,.mail,.tplc,.imp,.where,.emptybox,.kstrip,.tplcard,.alertbox,.nextstep,.pendbar,.menu button,.selitem,.recbox,.info,.empty,.drop,.photo,.lg-card,.card.pad{border-radius:var(--r)}
.card,.list,.tablewrap,.kpi,.dl,.where,.kstrip,.selitem,.info{box-shadow:none;border:1px solid var(--line)}
.mbox{border-radius:24px;padding:22px;box-shadow:var(--shadow-lg)}
.menu button{border-radius:18px;padding:16px 18px}
.menu button:hover{border-color:var(--line-strong);background:var(--surface-2)}
.thumb,.kthumb{border-radius:12px}
.selitem .thumb,.pickres .thumb{border-radius:10px}
.mico{border-radius:var(--pill)}
.list .row{padding:13px 16px}
.row:hover{background:var(--surface-2)}
.tbl th{background:var(--surface-2)}
.emptybox,.empty{border:1.5px dashed var(--line-strong);background:transparent}
.emptybox{padding:24px}
.recbox{border-radius:16px}
.errs{border-radius:16px}

/* botones: cuatro niveles claros */
.btn{height:42px;padding:0 18px;gap:8px;border-radius:var(--pill);border:0;background:var(--tonal);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:14px;letter-spacing:0;box-shadow:none;touch-action:manipulation;transition:background-color .12s,color .12s,box-shadow .12s,transform .1s}
.btn:hover{background:var(--tonal-2);border-color:transparent}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 20px -12px color-mix(in srgb,var(--accent) 85%,transparent)}
.btn.primary:hover{background:var(--accent-strong);box-shadow:0 12px 22px -12px color-mix(in srgb,var(--accent) 95%,transparent)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--tonal)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.btn.ghost.danger{background:transparent}
.btn.dangerfill{background:var(--bad);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:var(--pill)}
.btn.block{height:48px;font-size:15px}
.btn svg{width:17px;height:17px}
.btn.sm svg{width:15px;height:15px}
.btn[disabled]{opacity:.45}
.btn.rmore-btn,.btn.rmore-btn:hover{width:36px;height:36px;padding:0;background:transparent;color:var(--muted)}
.btn.rmore-btn:hover{background:var(--tonal)}
.mact .btn{height:46px}
.actions{gap:8px}
.linkbtn{font-family:var(--f-body);font-weight:600;color:var(--accent-strong);text-decoration:none}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.back{height:36px;padding:0 14px;border-radius:var(--pill);border:0;background:var(--tonal);font-weight:600;font-size:13.5px}
.photo-btn{border-radius:var(--pill);border:0;background:var(--surface);box-shadow:var(--shadow-md);padding:8px 14px}
.addtag{border-radius:var(--pill);padding:5px 11px}
.x{border-radius:var(--pill);background:var(--tonal)}
.iconbtn,.menubtn{width:42px;height:42px;border-radius:var(--pill);border:0;background:var(--tonal);color:var(--ink);box-shadow:none}
.iconbtn:hover,.menubtn:hover{background:var(--tonal-2);border-color:transparent}
.acctbtn{border-radius:var(--pill);border:0;background:var(--tonal);padding:4px 12px 4px 4px;height:42px}
.acctbtn:hover{background:var(--tonal-2);border-color:transparent}
.acctbtn .avatar{width:34px;height:34px}
.gsearch{height:42px;border-radius:var(--pill);background:var(--tonal);border:0;padding:0 8px 0 14px}
.gsearch kbd{border-radius:8px}
.toast{border-radius:22px;padding:8px 8px 8px 18px}
.toast .tact{border-radius:var(--pill)}
.tabs .nbadge,.nbadge,.chips .cnt{font-family:var(--f-body)}

/* chips (filtros) y segmentos (elecciones): azul marino, para no confundirlos con la acción azul */
.chip{height:34px;padding:0 14px;border-radius:var(--pill);font-family:var(--f-body);font-size:13.5px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);touch-action:manipulation}
.chip:hover{background:var(--surface-2);border-color:var(--ink-2)}
.chip[aria-pressed="true"],:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .cnt{background:var(--signal);color:var(--signal-ink)}
.chips{gap:8px}
.seg{gap:8px}
.seg span{border-radius:var(--pill);padding:9px 16px;font-size:14px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)}
.seg input:checked + span,.seg input[type=checkbox]:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg2 .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* campos */
.field input,.field select,.field textarea,.search input,.toolbar select,.xpick select,.filters select,.lg-form .field input,.lg-form .field select{border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:15px;padding:0 14px;min-height:44px;transition:border-color .12s,box-shadow .12s}
.field textarea{padding:11px 14px;min-height:0;line-height:1.45}
.field select,.toolbar select{padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2366788A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus,.toolbar select:focus,.lg-form .field input:focus,.lg-form .field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
@media (min-width:1024px){.field input,.field select,.search input,.toolbar select,.xpick select{min-height:40px;font-size:14px}.field textarea{font-size:14px}}
.field{gap:0}
.grid2{gap:12px}
.qstep{border-radius:var(--pill);overflow:hidden}
.qstep button{border-radius:0}
.pkc{border-radius:var(--r-xs)}

/* inicio: banda con curvas de nivel */
.home-head{position:relative;isolation:isolate;overflow:hidden;background:var(--night);color:var(--night-ink);border-radius:24px;padding:22px 22px 20px;margin:0 0 16px;align-items:flex-end}
.home-head .topo{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;z-index:-1;color:rgba(120,190,232,.26)}
.home-head .ph-date{color:var(--night-muted);font-weight:500}
.home-head .h1{color:#fff;font-size:32px;font-weight:700}
.home-head .lead{color:var(--night-muted)}
.home-head .quick .btn{background:rgba(255,255,255,.1);color:#fff}
.home-head .quick .btn:hover{background:rgba(255,255,255,.18)}
.home-head .quick .btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.home-head .quick .btn.primary:hover{background:var(--accent-strong)}
.home-head .quick .btn svg{color:currentColor}
@media (min-width:1024px){.home-head{padding:28px 28px 26px}.home-head .h1{font-size:38px}}
.kstrip{border-radius:var(--r);border:1px solid var(--line)}
.kc-l{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kc-cell .kpi-n{font-size:30px;font-weight:700;letter-spacing:-.01em}
.kc-cell{padding:14px 18px 15px}
.nextstep,.pendbar{border-radius:var(--r)}
.ns-ic,.pb-ic{border-radius:var(--pill)}
.pendbar .btn{background:var(--signal);color:var(--signal-ink)}
.pendbar .btn:hover{background:color-mix(in srgb,var(--signal) 85%,#000)}
@media (min-width:1024px){.sheet{border-radius:28px 0 0 28px}.sheet-head{border-radius:28px 0 0 0}}
.bar{border-radius:var(--r-xs)}
.bar-t,.bar-t span{border-radius:var(--pill)}
.cargocard{border-radius:var(--r)}

/* barra inferior flotante (celular) y lateral (escritorio) */
@media (max-width:1023px){
  .tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--line);border-radius:32px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:var(--shadow-lg)}
  .tabs .wrap{padding:8px 6px 7px}
  .tabs button{font-size:11px;font-weight:600;color:var(--muted)}
  .tabs button[aria-current="page"]{color:var(--ink)}
  .tabs button[aria-current="page"] svg{color:var(--accent)}
  .tabs .plus span.c{width:50px;height:50px;margin-top:-22px;box-shadow:0 0 0 5px var(--bg),0 10px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent);background:var(--accent)}
  .toast{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  .bulk{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  main{padding-block:14px 130px}
  .top .iconbtn,.top .acctbtn,.top .menubtn{background:var(--tonal);border:0;color:var(--ink)}
  .top .wrap{padding-block:9px}
}
@media (min-width:1024px){
  .tabs button{border-radius:12px;font-weight:500}
  .tabs .plus{height:44px;border-radius:var(--pill);font-weight:600;margin:0 0 16px}
  .tabs button[aria-current="page"]::before{display:none}
  .tabs button[aria-current="page"]{background:rgba(255,255,255,.1)}
  .side-brand .logo{border-radius:10px}
}
.drawer{border-radius:0 28px 28px 0}
.dr-close{border-radius:var(--pill)}
.dr-link,.dr-tile{border-radius:14px}
.dr-seg button{border-radius:var(--pill)}
.dr-out{border-radius:14px}

/* entrada */
.lg-card{border-radius:28px;padding:28px}
.lg-go{height:50px;font-size:15.5px}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function pad2(n){return String(n).padStart(2,'0');}
function fmt(iso){if(!iso)return '';const [d,t]=iso.split('T');const p=d.split('-');return (+p[2])+' '+MES[+p[1]-1]+(t?' · '+t.slice(0,5):'');}
function fday(iso){return fmt(iso).split(' · ')[0];}
function fdate(iso){if(!iso)return '';const p=iso.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]+(iso.length>10?' '+iso.slice(11,16):'');}
function nowIso(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function isoToMs(iso){const [d,t]=iso.split('T');const p=d.split('-').map(Number);const q=(t||'00:00').split(':').map(Number);return new Date(p[0],p[1]-1,p[2],q[0]||0,q[1]||0).getTime();}
function daysSince(iso){return Math.floor((Date.now()-isoToMs(iso))/86400000);}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function names(a){a=(a||[]).filter(Boolean);return a.length>1?a.slice(0,-1).join(', ')+' y '+a[a.length-1]:(a[0]||'');}
function namesO(a){a=(a||[]).filter(Boolean);return a.length>1?a.slice(0,-1).join(', ')+' o '+a[a.length-1]:(a[0]||'');}
function opts(arr,cur){return arr.map(v=>{const val=Array.isArray(v)?v[0]:v,l=Array.isArray(v)?v[1]:v;return '<option value="'+esc(val)+'"'+(String(cur)===String(val)?' selected':'')+'>'+esc(l)+'</option>';}).join('');}

function sortList(arr,fn,dir){return arr.slice().sort((a,b)=>{const x=fn(a),y=fn(b);if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y),'es',{numeric:true})*dir;return ((x>y)-(x<y))*dir;});}
function codeNum(c){const m=String(c||'').match(/(\d+)$/);return m?+m[1]:0;}
function nextCode(arr,field,prefix,w){let mx=0;arr.forEach(o=>{const n=codeNum(o[field]);if(n>mx)mx=n;});return prefix+String(mx+1).padStart(w,'0');}

function pump(){

/* conecta, pide la cuenta de Google y espera a que el usuario tenga acceso */
async function fbStart(){
 showGate('connecting');
 let fb;try{fb=await loadFirebase();}catch(e){showGate('error',{msg:'No se pudo cargar Firebase. Revisa tu conexión a internet.'});return null;}

 if(window.__MAQ_EMU){try{fs.useEmulator('127.0.0.1',8080);auth.useEmulator('http://127.0.0.1:9099',{disableWarnings:true});}catch(e){}}
 try{await fs.enablePersistence({synchronizeTabs:true});}catch(e){} // sin señal: lo registrado se guarda y se sube al volver la conexión
 FBA={fb,fs,auth};
 if(OAUTH_HASH){showGate('connecting');gConsumeRedirect();}
 const u=await new Promise(res=>{auth.onAuthStateChanged(x=>{if(x)res(x);else if(!OAUTH_BUSY)showGate('signin',GATE&&GATE.st==='signin'?{msg:GATE.msg}:{});});});
 const email=String(u.email||'').toLowerCase();const owner=isFbAdminEmail(email);
 showGate('connecting',{u});
 const memRef=fs.collection('miembros').doc(u.uid);
 let mem=null;
 try{const sn=await memRef.get();mem=sn.exists?sn.data():null;}
 catch(e){if(!(e&&e.code==='permission-denied')){showGate('error',{u,msg:'No se pudo conectar con la base. Revisa tu conexión a internet.'});return null;}}
 if(!mem&&owner){mem={email,nombre:u.displayName||email,admin:true,alta:nowIso(),por:'Administrador inicial'};
  try{await memRef.set(mem);}catch(e){showGate('error',{u,msg:'No se pudo registrar al administrador. Revisa que las reglas de Firestore estén publicadas con tu correo.'});return null;}}
 if(!mem){
  try{await fs.collection('solicitudes').doc(u.uid).set({email,nombre:u.displayName||'',fecha:nowIso()});}catch(e){}
  showGate('pending',{u});
  mem=await new Promise(res=>{const off=memRef.onSnapshot(sn=>{if(sn.exists){off();res(sn.data());}},()=>{});});
  try{await fs.collection('solicitudes').doc(u.uid).delete();}catch(e){}
 }
 FB_ADM=owner||!!mem.admin;

function isStandalone(){try{return !!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));}catch(e){return false;}}

 const q=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:gRedirectUri(),response_type:'id_token',scope:'openid email profile',nonce:nn,state:st,prompt:'select_account'});

 if(!cl||cl.nonce!==saved.nn)return fail('No se pudo comprobar el ingreso. Toca Entrar con Google otra vez.');

/* Lista de compra: lo que falta para completar los kits incompletos, descontando lo libre en almacén */
function compraList(){
 const pool=S.items.filter(i=>i.cond==='Operativo'&&!kitOf(i.id)&&i.loc.t==='almacen');
 const used=new Set();const need={};const asign=[];
 S.kits.forEach(k=>{const inf=kitInfo(k);inf.missing.forEach(ix=>{const s=slotOf(inf.t,ix);const c=pool.find(i=>!used.has(i.id)&&s.nps.includes(i.np));
  if(c){used.add(c.id);asign.push({k,s,i:c});}
  else{const key=s.nps.join('|');if(!need[key])need[key]={nps:s.nps.slice(),n:0,kits:[],slot:s.l};need[key].n++;if(!need[key].kits.includes(k.code))need[key].kits.push(k.code);}});});
 return {comprar:Object.values(need),asign};
}

function movsFiltered(){
 const q=norm(movQ);const now=nowIso();const d0=now.slice(0,10);
 const since=movPer==='hoy'?d0:movPer==='7'?(()=>{const d=new Date();d.setDate(d.getDate()-6);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());})():movPer==='mes'?d0.slice(0,8)+'01':'';
 return S.movs.filter(m=>{
  if(movFilter==='porrec'){if(!isOpen(m))return false;}
  else if(movFilter==='retrasados'){if(!(retrasoDias(m)>0))return false;}
  else if(movFilter==='kit'){if(!KIT_TIPOS.includes(m.tipo))return false;}
  else if(movFilter==='anulado'){if(m.estado!=='anulado')return false;}
  else if(movFilter!=='todos'&&m.tipo!==movFilter)return false;
  if(since&&m.fecha.slice(0,10)<since)return false;
  if(q){const its=m.items.map(item).filter(Boolean);const txt=[m.num,m.guia,m.agencia,m.origen,m.tipo==='Envío'?movDest(m):locText(m.destino),m.por,(m.dest||[]).join(' '),m.nota].concat(its.map(i=>i.nombre+' '+i.serie+' '+i.code+' '+i.np)).join(' ');if(!norm(txt).includes(q))return false;}
  return true;}).sort(byDateDesc);
}

 ask({title:c?'Categoría':'Nueva categoría',ok:'Guardar',html:'<div class="field"><label class="lab" for="ce-n">Nombre</label><input id="ce-n" value="'+esc(c?c.n:'')+'" placeholder="Ej. Nivel láser" autocomplete="off" maxlength="40"></div>'

/* ================= Hojas (paneles) y confirmaciones ================= */
function openSheet(fn){const args=[].slice.call(arguments,1);sheetStack.push({fn,args});renderSheet(true);}
function closeSheet(){sheetStack.pop();renderSheet(true);}
function replaceSheet(fn){const args=[].slice.call(arguments,1);sheetStack[sheetStack.length-1]={fn,args};renderSheet(true);}
function renderSheet(top){
 const el=$('#sheet');
 if(!sheetStack.length){el.hidden=true;$('#scrim').hidden=true;document.body.classList.remove('locked');navSync();return;}
 const s=sheetStack[sheetStack.length-1];let r=null;
 try{r=s.fn.apply(null,s.args);}catch(e){console.error(e);r=null;}
 if(!r){sheetStack.pop();return renderSheet(top);}
 el.hidden=false;$('#scrim').hidden=false;document.body.classList.add('locked');
 el.classList.toggle('wide',!!r.wide);
 $('#sheetTitle').textContent=r.title;
 const body=$('#sheetBody');const st=el.scrollTop;body.innerHTML=r.html;
 const bk=$('#sheetBack');if(bk)bk.textContent=sheetStack.length>1?'‹ Atrás':'✕ Cerrar';
 if(top)el.scrollTop=0;else el.scrollTop=st;
 navSync();
}

 if(o.skip){try{const r=o.fn&&o.fn();if(r&&r.catch)r.catch(e=>console.error(e));}catch(e){console.error(e);}return;}
 askFn=o.fn;lastFocus=document.activeElement;
 $('#mTitle').textContent=o.title;$('#mBody').innerHTML=o.html;
 const ok=$('#mOk');ok.textContent=o.ok||'Confirmar';ok.className='btn '+(o.danger?'dangerfill':'primary');$('#mCancel').hidden=!!o.info;
 $('#modal').hidden=false;setTimeout(()=>{try{$(o.info?'#mOk':'#mCancel').focus();}catch(e){}},30);
}

let PDFP=null;
function loadPdfLibs(){
 if(window.jspdf&&window.qrcode)return Promise.resolve();if(PDFP)return PDFP;
 const load=urls=>new Promise((res,rej)=>{let k=0;const next=()=>{if(k>=urls.length)return rej(new Error('load'));const sc=document.createElement('script');sc.src=urls[k++];sc.onload=()=>res();sc.onerror=()=>{sc.remove();next();};document.head.appendChild(sc);};next();});
 PDFP=Promise.all([window.jspdf?1:load(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js']),window.qrcode?1:load(['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'])]).catch(e=>{PDFP=null;throw e;});
 return PDFP;
}
function movLink(m){return location.origin+location.pathname.replace(/index\.html$/,'')+'#mov/'+encodeURIComponent(m.id);}
function pdfDate(iso){try{return new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)).replace(',','');}catch(e){return fmt(iso);}}
function pdfTxt(v){return String(v==null?'':v).replace(/→/g,'>').replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/✓/g,'Sí').replace(/[^\n\x20-\xFF]/g,'');}
function codeRuns(codes){
 const parse=c=>{const x=/^(.*?)(\d+)$/.exec(c);return x?{p:x[1],n:parseInt(x[2],10),w:x[2].length,c}:{p:c,n:NaN,w:0,c};};
 const xs=codes.map(parse).sort((a,b)=>a.p===b.p?a.n-b.n:a.p<b.p?-1:1);const out=[];
 for(let i=0;i<xs.length;){let j=i;while(j+1<xs.length&&xs[j+1].p===xs[i].p&&xs[j+1].n===xs[j].n+1)j++;
  out.push(j-i>=2?xs[i].c+' a '+xs[j].c:xs.slice(i,j+1).map(x=>x.c).join(', '));i=j+1;}
 return out.join(', ');
}
function constRows(m){
 const its=m.items.map(item).filter(Boolean);const out=[];const grp=new Map();
 its.forEach(i=>{const k=i.np+'|'+i.nombre;if(!grp.has(k)){const r={codes:[],nombre:i.nombre,np:i.np,series:[],sin:0,n:0};grp.set(k,r);out.push(r);}const r=grp.get(k);r.codes.push(i.code);r.n++;if(i.serie)r.series.push(i.serie);else r.sin++;});
 out.forEach(r=>{r.serie=r.series.join(', ')+(r.sin?(r.series.length?' + '+r.sin+' sin asignar':(r.n>1?r.sin+' sin asignar':'Sin asignar')):'');});
 return out;
}

 const errs=[];const needB=!NO_BOLETA.includes(F.agencia);
 if(!F.items.length)errs.push('Agrega al menos un equipo.');
 if(!F.d1)errs.push('Elige quién recibe.');
 if(F.d2&&F.d2===F.d1)errs.push('El segundo destinatario debe ser otra persona.');
 if(needB&&!F.guia.trim())errs.push('Escribe el número de guía de '+F.agencia+'.');
 const unpk=F.items.filter(id=>!(F.pk||[]).includes(id)).length;
 if(F.items.length&&unpk)errs.push('Revisión de empaque: marca “En caja” en '+plural(unpk,'equipo','equipos')+' (o “Marcar todos” si ya revisaste la caja).');
 if(needB){const r=bolReady('form');if(!r.ok)errs.push(r.msg);}
 if(!(F.paq||[]).length)errs.push('Toma al menos una foto del paquete (las cajas o bolsas que salen).');
 const dupG=needB&&F.guia.trim()&&S.movs.find(m=>m.tipo==='Envío'&&m.estado!=='anulado'&&normNum(m.guia)===normNum(F.guia));
 if(dupG)errs.push('La guía '+F.guia.trim()+' ya está registrada en '+dupG.num+'. Revisa el número.');
 if(errs.length)return fail(errs,!F.items.length?'pq':!F.d1?'f-d1':(needB&&(!F.guia.trim()||dupG))?'f-guia':!(F.paq||[]).length?'f-paq':'');
 F.errs=[];
 const dest=[F.d1,F.d2].filter(Boolean);
 const destLoc=F.destT==='tecnico'?tec(F.d1,F.obra):alm(F.destT);
 const o=obra(F.obra);const warn=kitWarnings();
 ask({skip:!warn.length,title:'Revisa antes de guardar',ok:'Guardar envío igual',html:'<p style="margin:0"><b>'+plural(F.items.length,'equipo','equipos')+'</b> para <b>'+esc(names(dest))+'</b>'+(F.destT==='tecnico'?(o?' · Obra '+esc(o.n)+' ('+esc(o.ciudad)+')':''):' · '+esc(F.destT))+'</p>'+itemsSum(F.items)
  +'<ul class="sum" style="margin-top:10px"><li>'+esc(F.agencia)+(F.guia.trim()?' · guía <span class="mono">'+esc(F.guia.trim())+'</span>':'')+(needB?' · boleta adjunta':'')+' · '+plural((F.paq||[]).length,'foto','fotos')+' del paquete'+(F.bultos?' · '+plural(+F.bultos,'bulto','bultos'):'')+'</li><li>Solo '+esc(namesO(dest))+' '+(dest.length>1?'podrán':'podrá')+' confirmar la recepción'+(needB?', con su propia boleta':'')+'.</li><li>Se avisará a '+esc(names(dest))+' en la app.</li>'+warn.map(w=>'<li style="color:var(--warn)">'+esc(w)+'</li>').join('')+'</ul>',
  fn:async()=>{
   setBusy('saveEnvio',true);try{
   const b=BOL.form;let ref=null;
   if(needB){try{ref=b.state==='sample'?'ej':await storeImage(b.src);}catch(e){toast('No se pudo guardar la foto de la boleta. Toma una foto más pequeña.','bad');return;}}
   let paq=[];try{paq=await Promise.all((F.paq||[]).map(u=>storeImage(u)));}catch(e){toast('No se pudieron guardar las fotos del paquete. Inténtalo de nuevo.','bad');return;}
   const its=F.items.map(item);const from={};its.forEach(i=>from[i.id]=clone(i.loc));
   const origen=[...new Set(its.map(i=>i.loc.t==='almacen'?i.loc.a:i.loc.p+' · '+((obra(i.loc.o)||{}).n||'')))].join(' + ');
   const kitAll=F.kit&&kitById(F.kit)&&kitById(F.kit).slots.filter(Boolean).every(id=>F.items.includes(id))?F.kit:null;
   const m=newMov({tipo:'Envío',por:meName(),origen,oc:city(its[0].loc),destino:destLoc,dest,items:F.items.slice(),agencia:F.agencia,guia:F.guia.trim(),boletaEnv:ref,bolHashEnv:b&&b.hash||null,bolCheck:needB?bolCheckRecord(b):null,nota:F.nota.trim(),estado:'pendiente',kit:kitAll,from,empaque:{por:meName(),fecha:nowIso(),n:F.items.length},paq,bultos:F.bultos?Math.max(1,parseInt(F.bultos,10)||1):null});
   its.forEach(i=>{i.loc={t:'transito',to:clone(destLoc),mov:m.id};});
   notify('envio',{titulo:'Envío '+m.num+': '+plural(its.length,'equipo','equipos')+' para '+names(dest)+(city(destLoc)?' ('+city(destLoc)+')':''),texto:meName()+' te envió '+plural(its.length,'equipo','equipos')+(m.agencia?' por '+m.agencia+(m.guia?', guía '+m.guia:''):'')+'. Confírmalo al recibir.',body:movBody(m),mov:m.id,para:dest});
   delete BOL.form;persist();checkKits(false);render();replaceSheet(sDone,m.id,'Envío guardado');
   }finally{setBusy('saveEnvio',false);}
  }});
}

 F.errs=[];const o=obra(F.obra);const warn=kitWarnings();const k=F.kit?kitById(F.kit):null;const wm=k&&!maqOk(tplOf(k),F.maq);
 ask({skip:!(warn.length||wm),title:'Revisa antes de guardar',ok:'Guardar igual',html:'<p style="margin:0">'+plural(F.items.length,'equipo queda instalado','equipos quedan instalados')+' en <b>'+esc(F.maq)+'</b> · Obra '+esc(o.n)+'.</p>'+itemsSum(F.items)+((warn.length||wm)?'<ul class="sum" style="margin-top:10px">'+warn.map(w=>'<li style="color:var(--warn)">'+esc(w)+'</li>').join('')+(wm?'<li style="color:var(--warn)">La plantilla es para '+esc(tplOf(k).maquinas.join(', '))+' y la máquina es '+esc(maqTipo(F.maq))+'.</li>':'')+'</ul>':''),fn:()=>{

  persist();checkKits(false);render();replaceSheet(sDone,m.id,'Retiro guardado');
